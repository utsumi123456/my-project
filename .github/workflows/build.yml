name: build set-agent

# Builds the distributable on both platforms. A Windows PC cannot produce the
# macOS bundle (PyInstaller does not cross-compile), so the Mac build lives
# here. Artifacts: SetAgent-windows (SetAgent.exe + はじめに.md) and
# SetAgent-macos (SetAgent-macOS.zip + はじめに.md). A tag v* also publishes
# them as a GitHub release.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "set-agent/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: set-agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: set-agent/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Unit tests
        env:
          SETAGENT_LLM_BACKEND: api      # no Claude sign-in on a runner: the Advisor path is what is tested
        run: python -m unittest discover -s tests -q

      - name: Build
        run: python build.py --no-tests

      - name: List dist
        shell: bash
        run: ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: SetAgent-${{ matrix.name }}
          path: set-agent/dist/*
          if-no-files-found: error

      # Release assets must have ASCII names: はじめに.md would be uploaded as
      # "default.md", so it travels as SetAgent-README.md.
      - name: Prepare release files (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          mkdir -p release
          for f in dist/*; do
            case "$(basename "$f")" in
              *.md) cp "$f" release/SetAgent-README.md ;;
              *)    cp "$f" release/ ;;
            esac
          done
          ls -la release

      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Set Agent ${{ github.ref_name }}
          files: set-agent/release/*
