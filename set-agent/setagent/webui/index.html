/* Freshness: the set on screen is a reading of master.db + -wal at one moment.
   Say when, and whether rekordbox is open. */
let FRESH = {state: "fresh", rb: null};   /* fresh | stale */
/* Lives in the settings sheet (2026-09-16 review): the panel follows rekordbox
   by itself, so a "reload" button on the main view read as a contradiction.
   The one case that needs the DJ -- a change held back because this app has
   unapplied trials -- lights the settings button instead. */
function renderFresh(){
  $("settings").classList.toggle("hasnew", FRESH.state === "stale" || FOLLOW === "no_permission");
  const txt = $("freshTxt"), b = $("rescan");
  if(!txt || !b) return;                      /* the sheet is not open */
  const at = LOADED_AT ? LOADED_AT.toLocaleTimeString("ja-JP", {hour:"2-digit", minute:"2-digit"}) : "—";
  txt.textContent = FRESH.state === "stale" ? "rekordbox changed" : `loaded ${at}`;
  b.className = FRESH.state === "stale" ? "btn primary" : "btn";
  b.textContent = "reload";
}

/* Automatic refresh (§5-1): poll master.db / -wal, and check on every window
   focus, since the DJ comes back here right after editing in rekordbox. While
   rekordbox is open every edit lands in the -wal (it never checkpoints until
   exit), and the decrypter replays it, so both files count as readable change.
   A change reloads by itself when nothing in this app would be lost;
   otherwise it lights the button and waits. */
let LIB_SIG = null, pollTimer = null, polling = false;
async function pollLibrary(){
  if(REMOTE || polling || !ST || !$("curtain").hidden) return;
  polling = true;
  try {
    const c = await window.pywebview.api.library_changed();
    if(!c || !c.ready) return;
    FRESH.rb = c.rekordbox_running;
    renderPublish(c.publish);
    renderDock(c.dock);
    if(PUB_WAIT) return;                 /* our own write is landing; pollPublish acknowledges it */
    if(!LIB_SIG){ LIB_SIG = c; renderFresh(); return; }
    if(c.db !== LIB_SIG.db || c.wal !== LIB_SIG.wal){
      const busy = drag || knobDrag || !$("modal").hidden || (ST.agent && ST.agent.pending);
      if(!c.edited && !busy){
        LIB_SIG = c;
        await refreshFromRekordbox("synced with rekordbox");
        return;
      }
      if(FRESH.state !== "stale")
        toast("rekordbox changed · reload in settings");
      FRESH.state = "stale";
    }
    LIB_SIG = c;
    renderFresh();
  } catch(e){ /* a failed poll is not news */ }
  finally { polling = false; }
}
async function refreshFromRekordbox(note){
  $("curtain").hidden = false; $("cTitle").textContent = "reloading from rekordbox…";
  $("cMsg").textContent = "master.db と -wal を読み直してセットを組み直します。";
  const s = await window.pywebview.api.rescan();
  LOADED_AT = new Date(); FRESH.state = "fresh"; LIB_SIG = (s && s.lib_sig) || null;
  followFailed = null;                 /* a reread library may know it now */
  apply(s, true);
  if(note && s && s.tracks) toast(note);
}
function startPolling(){
  clearInterval(pollTimer);
  pollTimer = setInterval(pollLibrary, 5000);
  setInterval(pollSync, 2000);
  setInterval(pollFollow, 1200);
  window.addEventListener("focus", pollLibrary);
  document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) pollLibrary(); });
}

/* ---------------- detail view ---------------- */
/* the waterfall: what trimming can actually buy, against the gap */
function renderReality(){
  const tgt = ST.target_s || 0, tot = ST.total_s;
  const over = Math.max(0, tot - tgt);
  const r = $("reality"), trims = ST.trims || [], sum = ST.trim_total_s || 0;
  /* within the target there is nothing to trim, so the row disappears (review) */
  r.parentElement.hidden = over <= 0;
  if(over <= 0){ r.innerHTML = ""; return; }
  r.className = "reality crit";
  const pct = sum ? (sum/over*100) : 0;
  const scale = v => Math.max(2, v/over*100);
  r.innerHTML = `<h3>削り代だけでは届きません</h3>
    <p>テンポ調整で稼げるのは全曲あわせて <b>${fmt(sum)}</b>。超過 <b>${fmt(over)}</b> の
       <b>${pct.toFixed(1)}%</b> です。曲を外す必要があります。</p>
    <div class="wf">` +
    trims.slice(0,8).map(t=>`<div class="wf-row">
        <span class="wf-name" title="${esc(t.title)}">${esc(t.title)}</span>
        <span class="wf-bar" style="width:${scale(t.gain_s)}%"></span>
        <span>−${fmt(t.gain_s)}</span></div>`).join("") +
    `<div class="wf-row wf-sum"><span class="wf-name" style="color:var(--ink-2)">trim total</span>
       <span class="wf-bar" style="width:${scale(sum)}%"></span>
       <span style="color:var(--caution-ink)">−${fmt(sum)}</span></div>
     <div class="wf-row"><span class="wf-name" style="color:var(--ink-2)">over</span>
       <span class="wf-bar gap" style="width:100%"></span>
       <span style="color:var(--critical-ink)">${fmt(over)}</span></div></div>`;
}

function renderLanes(){
  if(mode === "section") $("canvas").style.width = "100%";      /* measure after this */
  const k = pps(), W = mode === "section" ? laneWidth() : Math.max(ST.total_s*k, 800);
  if(mode !== "section") $("canvas").style.width = W + "px";
  $("density").textContent = mode === "section" ? "fit to width" : `1 min = ${DENSITY[mode]}px`;
  $("minimap").hidden = mode === "section";      /* the whole set is already in view */

  /* ruler marks at the coarsest step that leaves ≥48px between labels */
  const step = [60, 120, 300, 600, 900, 1800, 3600].find(s => s*k >= 48) || 3600;
  let r = "";
  for(let t = 0; t <= ST.total_s; t += step){
    if(mode === "section" && t*k + 44 > W) break;   /* a label past the right edge would force a scrollbar */
    r += `<div class="rmark" style="left:${(t*k).toFixed(1)}px">${fmt(t)}</div>`;
  }
  $("ruler").innerHTML = r;
  $("scroll").style.overflowX = mode === "section" ? "hidden" : "";

  let h = "";
  for(const t of ST.tracks){
    const x = t.start_s*k, w = Math.max((t.end_s - t.start_s)*k, 1);
    /* one grey per track, alternating; no analysis keeps its hatch */
    const inner = t.phrases.length ? "" : `<div class="none" title="フレーズ解析なし"></div>`;
    h += `<div class="trk${t.i % 2 ? " alt" : ""}" tabindex="0" data-i="${t.i}" data-sel="${t.i === ST.selected ? 1 : 0}"
            style="left:${x.toFixed(1)}px;width:${w.toFixed(1)}px"
            title="${esc(t.title)}
${fmt(t.start_s)} → ${fmt(t.end_s)}  再生 ${fmt(t.play_s)}
${t.bpm} BPM${t.set_tempo !== t.bpm ? " → " + t.set_tempo : ""} · ${esc(plabel(t.preset))}${t.locks.length ? " · ロック: " + esc(t.locks.join(",")) : ""}
${t.phrases.length ? "ダブルクリックでフレーズ構成" : "フレーズ解析なし"}">${inner}` +
         /* "No. title" on every block at both densities (2026-09-17). The label
            ellipsises to the block's width; a block too narrow for even one
            glyph plus the ellipsis gets none, so a row of lone "…" never appears */
         (w >= LABEL_MIN_PX ? `<div class="trk-t">${t.i+1}. ${esc(t.title)}</div>` : "") +
         `</div>`;
    if(t.milestone)
      h += `<div class="mile" style="left:${x.toFixed(1)}px" title="マイルストーン${t.milestone_s != null ? " 目標 " + fmt(t.milestone_s) : "（目標時刻なし）"}"></div>`;
  }
  if(ST.target_s) h += `<div class="tline" style="left:${(ST.target_s*k).toFixed(1)}px"></div>`;

  /* S4-3: what the ticked proposal would do, drawn over the set, nothing applied */
  const g = (ST.agent || {}).ghost;
  if(g && g.tracks){
    for(const t of g.tracks){
      const gx = t.start_s*k, gw = Math.max((t.end_s - t.start_s)*k, 1);
      h += `<div class="ghost" style="left:${gx.toFixed(1)}px;width:${gw.toFixed(1)}px"
              title="提案後: ${esc(t.title)}"></div>`;
    }
  }
  $("tracks").innerHTML = h;

  renderEnergy(W, k);
  renderSections(W, k);
}

function renderEnergy(W, k){
  /* the lane's height comes from the flex column, not a constant, so the curve
     fills whatever the window leaves for it */
  const H = Math.max(92, Math.round($("energy").clientHeight) || 150);
  const top = 8, base = H - 6;
  const ey = v => (base - v*(base - top)).toFixed(1);
  const ex = s => (s*k).toFixed(1);

  /* measured: one polyline, broken wherever analysis is missing */
  let paths = "", run = [];
  const flush = () => {
    if(run.length > 1){
      paths += `<path d="M${run[0][0]},${base}L` + run.map(p=>p[0]+","+p[1]).join("L") +
               `L${run[run.length-1][0]},${base}Z" fill="var(--measure)" fill-opacity=".08"
                 stroke="var(--measure)" stroke-width="1.25" stroke-linejoin="round"></path>`;
    }
    run = [];
  };
  for(const p of energyPoints(k)){
    if(!p.known){ flush(); continue; }
    run.push([ex(p.t), ey(p.e)]);
  }
  flush();

  /* unknown stretches get a hatch — never an interpolated value */
  let holes = "";
  for(const t of ST.tracks){
    if(t.phrases.length) continue;
    holes += `<rect x="${ex(t.start_s)}" y="${top}" width="${((t.end_s-t.start_s)*k).toFixed(1)}"
               height="${base-top}" fill="url(#hatch)"></rect>`;
  }

  /* deviation bands */
  let bands = "";
  for(const d of (ST.deviation || [])){
    const col = d.kind === "over" ? "var(--critical)" : "var(--caution)";
    bands += `<rect x="${ex(d.start_s)}" y="${top}" width="${((d.end_s-d.start_s)*k).toFixed(1)}"
               height="${base-top}" fill="${col}" fill-opacity="${d.kind === "over" ? ".07" : ".12"}"></rect>`;
  }

  /* target curve, over set length */
  let curve = "", knobs = "";
  if(ST.curve && ST.curve.length){
    curve = `<path d="` + ST.curve.map(([pos,v],i)=>
      `${i?"L":"M"}${ex(pos*ST.total_s)},${ey(v)}`).join("") +
      `" fill="none" stroke="var(--target)" stroke-width="1.25" stroke-dasharray="4 3"></path>`;
    knobs = ST.curve.map(([pos,v],i)=>
      `<rect class="knob" data-ci="${i}" x="${(ex(pos*ST.total_s) - KNOB/2).toFixed(1)}"
        y="${(ey(v) - KNOB/2).toFixed(1)}" width="${KNOB}" height="${KNOB}"
        fill="var(--target)" stroke="var(--surface)" stroke-width="2"></rect>`).join("");
  }

  $("energy").innerHTML =
    `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img"
       aria-label="実測エネルギーとターゲットカーブ">
      <defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"
        patternTransform="rotate(45)">
        <rect width="1" height="8" fill="var(--line)"></rect></pattern></defs>
      ${bands}${holes}
      <line x1="0" y1="${base}" x2="${W}" y2="${base}" stroke="var(--line)" stroke-width="1"></line>
      ${paths}${curve}${knobs}
    </svg>`;
  ENERGY_GEOM = {top, base, W};
}

/* At the fit-to-width density a 137-minute set is ~3px per minute, and every
   sample drawn is noise. The measured curve is averaged into 3px buckets so the
   hills and valleys stay readable in a tall, narrow panel. Gaps stay gaps: a
   bucket that is mostly "no analysis" breaks the line (never interpolated). */
function energyPoints(k){
  const pts = ST.energy || [];
  if(mode !== "section" || pts.length < 4) return pts;
  const bucketS = 3 / k, n = Math.max(1, Math.ceil(ST.total_s / bucketS));
  const sum = new Float64Array(n), cnt = new Uint32Array(n), unk = new Uint32Array(n);
  for(const p of pts){
    const b = Math.min(n - 1, Math.max(0, Math.floor(p.t / bucketS)));
    if(p.known){ sum[b] += p.e; cnt[b]++; } else unk[b]++;
  }
  const out = [];
  for(let b = 0; b < n; b++){
    if(!cnt[b] && !unk[b]) continue;
    const t = (b + .5) * bucketS;
    if(cnt[b] < unk[b]) out.push({t, e: 0, known: false});
    else out.push({t, e: sum[b] / cnt[b], known: true});
  }
  return out;
}

/* ---- target curve: drag a control point, double-click to add, right-click to remove ---- */
let ENERGY_GEOM = {top: 8, base: 144, W: 1};
let knobDrag = null;
const KNOB = 10;   /* side of a square curve knob, px */

function curveAt(clientX, clientY){
  const svg = $("energy").querySelector("svg");
  if(!svg) return null;
  const r = svg.getBoundingClientRect();
  if(!r.width || !r.height) return null;   /* lane not laid out (detail view hidden) */
  const {top, base} = ENERGY_GEOM;
  const pos = (clientX - r.left) / Math.max(r.width, 1);
  const energy = (base - (clientY - r.top)) / Math.max(base - top, 1);
  return {pos: Math.min(1, Math.max(0, pos)), energy: Math.min(1, Math.max(0, energy))};
}
$("energy").addEventListener("pointerdown", e=>{
  const k = e.target.closest(".knob"); if(!k) return;
  knobDrag = {i: +k.dataset.ci, node: k};
  k.setPointerCapture?.(e.pointerId);
});
window.addEventListener("pointermove", e=>{
  if(!knobDrag) return;
  const c = curveAt(e.clientX, e.clientY); if(!c) return;
  const {top, base, W} = ENERGY_GEOM;
  knobDrag.at = c;
  knobDrag.node.setAttribute("x", (c.pos * W - KNOB/2).toFixed(1));
  knobDrag.node.setAttribute("y", (base - c.energy * (base - top) - KNOB/2).toFixed(1));
});
window.addEventListener("pointerup", async ()=>{
  if(!knobDrag) return;
  const d = knobDrag; knobDrag = null;
  if(!d.at) return;
  apply(await window.pywebview.api.move_curve_point(d.i, d.at.pos, d.at.energy));
});
$("energy").addEventListener("dblclick", async e=>{
  if(!ST.curve || !ST.curve.length){ toast("先に目標カーブを選んでください"); return; }
  if(e.target.closest(".knob")) return;
  const c = curveAt(e.clientX, e.clientY); if(!c) return;
  apply(await window.pywebview.api.add_curve_point(c.pos, c.energy));
});
$("energy").addEventListener("contextmenu", async e=>{
  const k = e.target.closest(".knob"); if(!k) return;
  e.preventDefault();
  apply(await window.pywebview.api.remove_curve_point(+k.dataset.ci));
});

function renderSections(W, k){
  if(!ST.sections.length){ $("sections").innerHTML = ""; return; }
  $("sections").innerHTML = ST.sections.map(s=>{
    const x = s.start_s*k, w = Math.max((s.end_s - s.start_s)*k, 130);
    const has = s.target_s != null && s.target_s > 0;
    const ratio = has ? Math.min(s.actual_s/s.target_s, 1) : 1;
    const diff = has ? s.actual_s - s.target_s : null;
    return `<div class="sec" style="left:${x.toFixed(1)}px;width:${w.toFixed(1)}px">
      <div class="sec-n" title="${esc(s.name)}">${esc(s.name)}</div>
      <div class="sec-b"><div class="sec-f" style="width:${(ratio*100).toFixed(1)}%"></div>
        ${has?`<div class="sec-t" style="left:98%"></div>`:""}</div>
      <div class="sec-v">${s.tracks} tracks · ${fmt(s.actual_s)}` +
        (diff == null ? " · no target"
          : ` · <span class="${diff>0?"o":"u"}">${diff>0?"+":"−"}${fmt(Math.abs(diff))}</span>`) +
      `</div></div>`;
  }).join("");
}

function renderMinimap(){
  const mm = $("minimap"), w = mm.clientWidth, k = w/Math.max(ST.total_s,1);
  let h = `<div class="mm-view" id="mmView"></div>`;
  let lane = "";
  for(const t of ST.tracks){
    lane += `<div style="position:absolute;top:0;height:14px;left:${(t.start_s*k).toFixed(1)}px;
              width:${Math.max((t.end_s-t.start_s)*k,.5).toFixed(1)}px;
              background:${t.phrases.length ? (t.i % 2 ? "var(--trk-b)" : "var(--trk-a)") : "var(--line-soft)"}"></div>`;
  }
  const H = 26, top = 14;
  let d = `M0,${top+H}`;
  for(const p of ST.energy) if(p.known) d += `L${(p.t*k).toFixed(1)},${(top+H-2-p.e*(H-4)).toFixed(1)}`;
  d += `L${w},${top+H}Z`;
  mm.innerHTML = lane +
    `<svg width="${w}" height="${top+H}" style="position:absolute;left:0;top:0">
       <path d="${d}" fill="var(--measure)" fill-opacity=".08" stroke="var(--measure)"
         stroke-width="1"></path></svg>` +
    (ST.target_s ? `<div style="position:absolute;top:0;bottom:0;width:2px;background:var(--target);
       left:${(ST.target_s*k).toFixed(1)}px"></div>` : "") + h;
}

function syncView(){
  if($("minimap").hidden) return;
  const sc = $("scroll"), mmW = $("minimap").clientWidth, cw = $("canvas").clientWidth || 1;
  const v = $("mmView"); if(!v) return;
  v.style.left = (sc.scrollLeft/cw*mmW) + "px";
  v.style.width = Math.min(sc.clientWidth/cw, 1)*mmW + "px";
}

/* the warning list left the panel (2026-09-16 review): the length verdict is
   the hero, flat stretches are visible in ENERGY, and the agent still reads
   ST.warnings when asked */
function renderMeta(){
  const miss = ST.analysis.total - ST.analysis.present;
  /* a count is only news when some track lacks analysis (review) */
  $("analysisMeta").textContent = miss > 0 ? `no phrase data ${miss}/${ST.analysis.total}` : "";
}

function renderSelected(){
  const t = ST.tracks.find(x => x.i === ST.selected);
  if(!t){
    $("selTitle").textContent = "—";
    $("selKv").innerHTML = "";
    return;
  }
  $("selTitle").textContent = `${t.i+1}. ${t.title}`;
  const ph = t.phrases.length ? t.phrases.map(p=>p.label).join(" → ") : "none";
  $("selKv").innerHTML =
    `<dt>position</dt><dd>${fmt(t.start_s)} → ${fmt(t.end_s)}</dd>
     <dt>play</dt><dd>${fmt(t.play_s)}</dd>
     <dt>BPM</dt><dd>${t.bpm}${t.set_tempo !== t.bpm ? " → " + t.set_tempo + " (set)" : ""}</dd>
     <dt>Mix</dt><dd>${esc(plabel(t.preset))}</dd>
     <dt>phrases</dt><dd style="white-space:normal">${esc(ph)}
       ${t.phrases.length ? ` <a href="#" class="hintq" id="selPhrases">show</a>` : ""}</dd>`;
}

/* ---------------- modal ---------------- */
function modal(title, bodyHTML, actions){
  $("mTitle").textContent = title;
  $("mBody").innerHTML = bodyHTML;
  $("mActions").innerHTML = "";
  for(const a of actions){
    const b = document.createElement("button");
    b.className = "btn" + (a.primary ? " primary" : "") + (a.danger ? " danger" : "");
    b.textContent = a.label;
    b.addEventListener("click", ()=>{ if(a.run) a.run(); if(a.close !== false) closeModal(); });
    $("mActions").appendChild(b);
  }
  $("modal").hidden = false;
  const first = $("mBody").querySelector("input,select,textarea") || $("mActions").firstChild;
  if(first) first.focus();
}
function closeModal(){ $("modal").hidden = true; }
$("modal").addEventListener("click", e=>{ if(e.target === $("modal")) closeModal(); });
window.addEventListener("keydown", e=>{ if(e.key === "Escape" && !$("modal").hidden) closeModal(); });

window.addEventListener("resize", ()=>{

/* click selects. The order is rekordbox's, so nothing here drags or trims. */
let drag = null;
function selectTrack(i){
  ST.selected = i;
  document.querySelectorAll(".trk,.row").forEach(x => x.dataset.sel = (+x.dataset.i === i) ? 1 : 0);
  renderSelected();
  window.pywebview.api.select(i);
}

});

/* ---- phrase sheet: the rekordbox phrase colours, one track at a time ---- */
function showPhrases(i){
  const t = ST.tracks.find(x => x.i === i); if(!t) return;
  const span = Math.max(t.end_s - t.start_s, 0.001);
  let strip, body;
  if(t.phrases.length){
    strip = t.phrases.map(p => `<div class="ph" title="${esc(p.label)} ${fmt(p.start_s)}–${fmt(p.end_s)}"
        style="left:${((p.start_s - t.start_s)/span*100).toFixed(2)}%;width:${((p.end_s - p.start_s)/span*100).toFixed(2)}%;
        background:${PH_COLOR[p.group] || "var(--ph-verse)"}"></div>`).join("");
    body = `<div class="ph-list">` + t.phrases.map(p =>
      `<span class="lg"><i class="sw" style="background:${PH_COLOR[p.group] || "var(--ph-verse)"}"></i>${esc(p.label)}<b>${fmt(p.start_s)}–${fmt(p.end_s)}</b></span>`).join("") + `</div>
      <p class="hint">色は rekordbox のフレーズ色と同じ意味です（Intro 橙 / Up 紫 / Chorus 緑 / Down 茶 / Outro 青 / Verse 灰）</p>`;
  } else {
    strip = `<div class="none"></div>`;
    body = `<p>この曲にはフレーズ解析がありません。rekordbox の環境設定 &gt; 解析 で「フレーズ」をオンにして再解析すると出ます。</p>`;
  }
  modal(`${i + 1}. ${t.title}`,
    `<p class="hint">${fmt(t.start_s)} → ${fmt(t.end_s)} · play ${fmt(t.play_s)} · ${t.bpm} bpm · ${esc(plabel(t.preset))}</p>
     <div class="phrase-strip">${strip}</div>${body}`,
    [{label: "close"}]);
}
/* keyboard: Enter selects the block, Shift+Enter opens its phrase sheet */
$("tracks").addEventListener("keydown", e=>{
  const n = e.target.closest(".trk"); if(!n || e.key !== "Enter") return;
  e.preventDefault();
  if(e.shiftKey) showPhrases(+n.dataset.i); else selectTrack(+n.dataset.i);
});
$("tracks").addEventListener("dblclick", e=>{
  const n = e.target.closest(".trk"); if(!n) return;
  showPhrases(+n.dataset.i);
});
$("selKv").addEventListener("click", e=>{
  if(e.target.id !== "selPhrases") return;
  e.preventDefault();
  if(ST.selected != null) showPhrases(ST.selected);
});

/* ---- set tempo: one BPM for the set, plus change points ---- */
let bpmVarOpen = false;
/* the BPM in force just before track `idx` (set BPM, then each earlier change point) */
function bpmBefore(idx){
  let running = ST.set_bpm;
  for(const c of (ST.bpm_changes || [])) if(c.i < idx) running = c.bpm;
  return running;
}
function renderCpFrom(){
  const from = bpmBefore(+$("cpTrack").value || 0);
  /* avoid-ai-design-ignore: CP3 -- "140 →" is the from-value of a from→to field, not a button label */
  $("cpFrom").textContent = from != null ? `${from} →` : "";
}
function renderBpmVar(){
  /* the field always shows the BPM the prediction uses; "自動" marks the playlist median */
  const f = $("setBpm");
  if(document.activeElement !== f) f.value = ST.set_bpm != null ? String(ST.set_bpm) : "";
  f.classList.toggle("auto", !!ST.set_bpm_auto);
  $("setBpmAuto").textContent = ST.set_bpm_auto && ST.set_bpm != null ? "auto" : "";
  $("setBpmAuto").title = ST.set_bpm_auto ? "プレイリストの BPM 中央値です。数字を入れると置き換わります" : "";

  const cps = ST.bpm_changes || [];
  if(cps.length) bpmVarOpen = true;
  $("bpmVar").checked = bpmVarOpen;
  $("bpmv").hidden = !bpmVarOpen;
  if(!bpmVarOpen) return;
  $("cpList").innerHTML = cps.length ? cps.map(c =>
    `<div class="cp"><span class="t">from ${c.i + 1}. ${esc(c.title)}</span>
       <b title="${c.from_bpm != null ? c.from_bpm + " BPM からこの BPM に" : "この曲からの BPM"}">${c.from_bpm != null ? c.from_bpm + " → " : ""}${c.bpm} BPM</b>
       <button class="btn" data-cp="${c.i}" title="この変化点を外す">remove</button></div>`).join("")
    : `<p class="none-yet">まだ変化点がありません。下で「この曲から何 BPM」を追加してください</p>`;
  const sel = $("cpTrack"), keep = sel.value;
  sel.innerHTML = ST.tracks.map(t => `<option value="${t.i}">${t.i + 1}. ${esc(t.title)}</option>`).join("");
  if(keep && [...sel.options].some(o => o.value === keep)) sel.value = keep;
  renderCpFrom();
}
$("cpTrack").addEventListener("change", renderCpFrom);
$("setBpm").addEventListener("change", async ()=>

$("bpmVar").addEventListener("change", async ()=>{
  bpmVarOpen = $("bpmVar").checked;
  if(!bpmVarOpen){                      /* switching off removes the change points */
    for(const c of (ST.bpm_changes || [])) await window.pywebview.api.set_bpm_change(c.i, null);
    apply(await window.pywebview.api.state());
  } else renderBpmVar();
});

/* ---- settings: how the agent reaches Claude ----
   First choice is the Claude Code sign-in already on this PC (the company
   seat; no key). An API key is the fallback for a PC without Claude Code.
   Either way the invariant holds: with neither, the Advisor answers. */
function connHtml(s){
  const c = s.cli || {};
  const seat = c.subscription === "enterprise" ? "企業アカウント" : (c.subscription || "ログイン済み");
  if(s.mode === "cli")
    return `<span class="dot on"></span><span>Claude Code ${esc(c.version || "")} に接続しています（${esc(c.org || seat)}）</span>`;
  if(c.found && !c.logged_in)
    return `<span class="dot warn"></span><span>Claude Code は見つかりましたが、ログインしていません</span>
            <button class="btn" id="fLogin" title="Claude Code のログイン画面をコンソールで開きます。会社のアカウントでログインしてください">log in</button>`;
  if(!c.found && s.backend !== "off")
    return `<span class="dot"></span><span>Claude Code が見つかりません。Claude Desktop を入れてログインすると、キーなしで使えます</span>`;
  if(s.mode === "api")
    return `<span class="dot on"></span><span>API キーで接続しています（${esc(s.api_model)}）</span>`;
  return `<span class="dot"></span><span>${esc(s.status || "ルールベースのアドバイザで動いています")}</span>`;
}
function modelOptions(s){
  const cur = s.model || "sonnet";
  const opts = MODELS.slice();
  if(!opts.some(o => o[0] === cur)) opts.push([cur, cur]);
  return opts.map(([v, l]) => `<option value="${esc(v)}"${v === cur ? " selected" : ""}>${esc(l)}</option>`).join("");
}

let dragging = false;
function jump(clientX){
  const r = $("minimap").getBoundingClientRect();
  const f = Math.min(Math.max((clientX - r.left)/r.width, 0), 1);
  const sc = $("scroll");
  sc.scrollLeft = f*$("canvas").clientWidth - sc.clientWidth/2;
}

/* ---- follow the playlist rekordbox is showing (selection.py) ---- */
let following = false, followBusy = 0, followFailed = null;
async function pollFollow(){
  if(REMOTE || following || !ST || !$("curtain").hidden) return;
  following = true;
  try {
    const r = await window.pywebview.api.rb_selection();
    if(!r) return;
    /* a slow answer from a busy rekordbox says nothing about the selection: keep what is
       shown -- but say so once it lasts (~5s), so a stalled follow is never silent */
    followBusy = r.why === "busy" ? followBusy + 1 : 0;
    const was = FOLLOW;
    if(r.why !== "busy" || followBusy >= 4) FOLLOW = r.why;
    if(was !== FOLLOW) renderHead();
    const busy = !$("modal").hidden || (ST.agent && ST.agent.pending) || (PUB && PUB.active);
    /* load by id, not through the picker: a playlist made in rekordbox after boot is
       not among the picker's options until the library is reread, and loading the
       picker's value instead reloaded the old playlist every poll (2026-10-09) */
    if(r.changed && !busy && r.playlist_id !== followFailed){
      await reload(r.playlist_id);
      followFailed = ST && ST.playlist_id === r.playlist_id ? null : r.playlist_id;
      if([...$("pl").options].some(o => o.value === r.playlist_id)) $("pl").value = r.playlist_id;
    }
  } catch(e){ /* nothing to say */ }
  finally { following = false; }
}

/* ---- write-back (A): rekordbox へ ---- */
/* The DJ's button is the only path that writes. The agent can put a card in
   the drawer; the card opens this same sheet. */
const HOW_LABEL = {now:"now", when_closed:"when rekordbox quits", quit_write_relaunch:"quit · export · relaunch"};
const STATE_LABEL = {queued:"queued", waiting:"waiting for rekordbox to quit", quitting:"quitting rekordbox",
                     writing:"writing", relaunching:"relaunching rekordbox"};
let PUB = null, PUB_WAIT = false, pubTimer = null;
function renderPublish(p){
  if(!p) return;
  PUB = p;
  const st = $("pubState");
  const last = p.last;
  if(st) st.textContent = p.active ? (STATE_LABEL[p.state] || "")
    : last && last.ok ? "exported" : "";
  const w = $("impWrite");
  if(w && p.active) w.textContent = "export status";
  if(p.active && !PUB_WAIT) watchPublish();
}
function watchPublish(){
  PUB_WAIT = true;
  clearInterval(pubTimer);
  pubTimer = setInterval(pollPublish, 1000);
}
async function pollPublish(){
  let p;
  try { p = await window.pywebview.api.publish_status(); } catch(e){ return; }
  renderPublish(p);
  if(p.active) return;
  clearInterval(pubTimer); PUB_WAIT = false;
  /* our own write changed master.db: take that as the new baseline instead of
     calling it "a change in rekordbox" */
  try { LIB_SIG = await window.pywebview.api.library_changed(); } catch(e){}
  const last = p.last;
  if(p.needs_force){ confirmForce(); return; }
  if(p.state === "cancelled"){ toast("export cancelled"); }
  else if(last && last.ok){
    toast(`exported "${last.name}"` + (last.error ? ` · ${last.error}` : ""));
  } else if(last){ toast("export failed: " + last.error); }
  apply(await window.pywebview.api.state());
}
function confirmForce(){
  modal("rekordbox didn't quit",
    `<p>rekordbox に確認が出ていないか見てください。</p>
     <p class="hint warn">強制終了すると、保存していない変更が失われることがあります。</p>`,
    [{label:"cancel", primary:true},
     {label:"force quit & export", danger:true, run: ()=> submitPublish(PUB_NAME, "quit_write_relaunch", true)}]);
}
let PUB_NAME = null, pubPrevTimer = null;
async function submitPublish(name, how, force){
  const r = await window.pywebview.api.publish(name, how, !!force);
  if(!r || !r.ok){ toast((r && r.error) || "export failed"); return; }
  renderPublish(r);
  watchPublish();
  toast(how === "when_closed" ? "exports when rekordbox quits"
       : how === "quit_write_relaunch" ? "quitting rekordbox to export…" : "exporting…");
  apply(await window.pywebview.api.state());
}
function pubBody(pv){
  const p = pv.plan, rb = pv.rekordbox_running;
  const skip = (p.skipped || []).length
    ? `<p class="pub-skip">skipped ${p.skipped.length}: ${p.skipped.map(x => esc(x.title || x.track_id)).join("、")}</p>` : "";
  return `<div class="field"><span>name · Set Agent folder</span>
            <input type="text" id="pubName" value="${esc(p.name)}" maxlength="120"></div>
     <p id="pubText">${p.replaces ? "replaces" : "new playlist"} · ${p.track_ids.length} tracks</p>
     ${skip}
     <div class="pub-state"><span class="dot${rb ? " rb" : ""}"></span>${rb ? "rekordbox is running" : "書き込む前にバックアップを取ります"}</div>`;
}
async function openPublish(name){
  if(REMOTE){ toast("rekordbox への書き込みは PC の Set Agent で行ってください"); return; }
  const st = await window.pywebview.api.publish_status();
  if(st && st.active){
    modal("export",
      `<p>${esc(st.name)} · ${st.tracks} tracks · ${esc(STATE_LABEL[st.state] || st.state)} (${esc(HOW_LABEL[st.how] || "")})</p>`,
      [{label:"close", primary:true},
       ...(st.state === "waiting" || st.state === "queued" ? [{label:"cancel export", danger:true, run: async ()=>{
          const r = await window.pywebview.api.publish_cancel(); renderPublish(r); }}] : [])]);
    return;
  }
  const pv = await window.pywebview.api.publish_preview(name || null);
  if(!pv || !pv.available){ toast((pv && pv.error) || "書き込みは使えません"); return; }
  const rb = pv.rekordbox_running;
  const go = how => ({close:true, run: ()=> submitPublish(PUB_NAME, how, false)});
  modal("export to rekordbox", pubBody(pv), rb
    ? [{label:"cancel"},
       {label:"when rekordbox quits", ...go("when_closed")},
       {label:"quit & export", primary:true, ...go("quit_write_relaunch")}]
    : [{label:"cancel"}, {label:"export", primary:true, ...go("now")}]);
  PUB_NAME = pv.plan.name;
  $("pubName").addEventListener("input", ()=>{
    PUB_NAME = $("pubName").value;
    clearTimeout(pubPrevTimer);
    pubPrevTimer = setTimeout(async ()=>{
      const q = await window.pywebview.api.publish_preview(PUB_NAME);
      if(q && q.available && !$("modal").hidden && $("pubText"))
        $("pubText").textContent = `${q.plan.replaces ? "replaces" : "new playlist"} · ${q.plan.track_ids.length} tracks`;
    }, 300);
  });
}
$("pending").addEventListener("click", async e=>{
  if(e.target.id === "metaNo") apply(await window.pywebview.api.dismiss_metadata());
  if(e.target.id === "metaGo"){
    const r = await window.pywebview.api.write_metadata(FRESH.rb ? "quit_write_relaunch" : "now", false);
    if(!r || !r.ok){ toast((r && r.error) || "export failed"); return; }
    watchPublish(); apply(await window.pywebview.api.state());
  }
});
$("pending").addEventListener("click", async e=>{
  if(e.target.id === "pubCardGo") openPublish(e.target.dataset.name);
  if(e.target.id === "pubCardNo") apply(await window.pywebview.api.dismiss_publish_card());
});

async function fillBackups(){
  const box = $("fBackups"); if(!box) return;
  let r;
  try { r = await window.pywebview.api.backups(); } catch(e){ box.textContent = ""; return; }
  const list = (r && r.backups) || [];
  if(!list.length){ box.innerHTML = `<span class="meta">none yet</span>`; return; }
  box.innerHTML = list.map(b => `<div class="bk-row"><span>${esc(b.created.replace("T", " "))}
      <span class="meta">${esc(b.reason)}</span></span>
      <button class="btn" data-bk="${esc(b.id)}">restore</button></div>`).join("");
  box.querySelectorAll("[data-bk]").forEach(btn => btn.addEventListener("click", ()=>{
    const id = btn.dataset.bk;
    closeModal();
    modal("restore this backup?",
      `<p>rekordbox のライブラリをこの時点に戻します。それ以降の rekordbox での変更も戻ります。rekordbox を閉じてから実行してください。</p>`,
      [{label:"cancel", primary:true},
       {label:"restore", danger:true, run: async ()=>{
          const x = await window.pywebview.api.restore_backup(id);
          toast(x.error || "restored");
          if(!x.error) refreshFromRekordbox(null);
       }}]);
  }));
}

/* ---- agent drawer ---- */
function openDrawer(on){
  $("drawer").hidden = !on;
  if(on){
    seenMsgs = ((ST.agent || {}).chat || []).length;
    $("agentBtn").classList.remove("hasnew");
    const c = $("chat"); c.scrollTop = c.scrollHeight;
    setTimeout(()=> $("askText").focus(), 30);
  }
}
$("agentBtn").addEventListener("click", ()=> openDrawer($("drawer").hidden));
$("dwClose").addEventListener("click", ()=> openDrawer(false));
window.addEventListener("keydown", e=>{
  if(e.key === "Escape" && $("modal").hidden && !$("drawer").hidden) openDrawer(false);
});

async function send(){
  const t = $("askText").value.trim();
  if(!t) return;
  $("askText").value = "";
  $("askSend").disabled = true;
  try { apply(await window.pywebview.api.ask(t)); }
  finally { $("askSend").disabled = false; $("askText").focus(); }
}
$("askSend").addEventListener("click", send);
$("askText").addEventListener("keydown", e=>{ if(e.key === "Enter") send(); });
$("askHints").addEventListener("click", e=>{
  const a = e.target.closest(".hintq"); if(!a) return;
  e.preventDefault();
  $("askText").value = a.dataset.q;
  send();
});
$("model").addEventListener("change", async ()=>
  apply(await window.pywebview.api.set_model($("model").value)));
$("cands").addEventListener("click", async e=>{
  const b = e.target.closest(".cand"); if(!b) return;
  apply(await window.pywebview.api.insert_candidate(b.dataset.id, null));
});
$("pending").addEventListener("change", async e=>{
  const c = e.target.closest(".op"); if(!c) return;
  apply(await window.pywebview.api.set_item_approved(+c.dataset.i, c.checked));
});
$("pending").addEventListener("click", async e=>{
  if(e.target.id === "applyPending") apply(await window.pywebview.api.apply_pending());
  if(e.target.id === "rejectPending") apply(await window.pywebview.api.reject_pending());
});

window.addEventListener("pywebviewready", boot);
</script>
</body></html>
