<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<title>Set Agent — Workbench</title>
<style>
:root{
  color-scheme:dark;
  --page:#0d1014; --surface:#14171c; --raised:#1c2128; --sunken:#0a0c0f;
  --line:#2d333b; --line-soft:#222831;
  --ink:#f0f3f6; --ink-2:#b9c2cc; --ink-3:#8b95a3;   /* ink-3: 5.3:1 on raised (was 4.4) */

  /* phrase palette — rekordbox 7 hues, re-stepped for this surface.
     validated: lightness band / chroma floor / CVD / normal-vision / contrast */
  --ph-intro:#c83201; --ph-up:#8c32ff; --ph-chorus:#1fb013;
  --ph-down:#955b00; --ph-outro:#2f84cf; --ph-verse:#5a6270;

  --target:#f778ba; --critical:#d03b3b; --caution:#fab219; --measure:#4a9be8;
  /* fills keep the deep red; text uses a lighter step so 12px labels read (5.5:1) */
  --critical-ink:#ec6059; --ok:#1fb013;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;
  /* Same face as rekordbox (2026-09-16): its browser and menus draw in the
     Windows system Arial (Preferences > View, default "Arial"), with the OS
     supplying Japanese glyphs. No font is bundled with rekordbox, so none is
     bundled here either -- the two panels share the machine's fonts. Numbers
     stay column-aligned through font-variant-numeric, not a monospace face. */
  --sans:"Arial","Yu Gothic UI","Meiryo UI",system-ui,sans-serif;
  --mono:"Arial","Yu Gothic UI","Meiryo UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px;border:2px solid var(--surface)}
::-webkit-scrollbar-thumb:hover{background:#3d4550}
::-webkit-scrollbar-track{background:transparent}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--sans);
  font-size:14px;line-height:1.5;overflow:hidden;font-variant-numeric:tabular-nums}
button,select,input{font-family:inherit;font-size:13px}

.app{display:flex;flex-direction:column;height:100vh}

/* ---- control bar ---- */
/* one row at the panel's 380px floor: tabs + four buttons, undo/redo as glyphs */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s2);flex:none;
  padding:var(--s3) var(--s4);border-bottom:1px solid var(--line);background:var(--surface)}
.bar label{display:flex;align-items:center;gap:6px;color:var(--ink-3);font-size:12px}
.bar select,.bar input[type=text]{background:var(--raised);color:var(--ink);
  border:1px solid var(--line);border-radius:3px;padding:5px 7px}
.bar input[type=text]{width:74px;font-family:var(--mono);text-align:center}
.btn{appearance:none;background:var(--raised);color:var(--ink-2);border:1px solid var(--line);
  border-radius:3px;padding:6px 11px;cursor:pointer}
.btn:hover{border-color:#3d4550;color:var(--ink)}
.btn:focus-visible,.seg button:focus-visible,select:focus-visible,input:focus-visible,
.row:focus-visible,.trk:focus-visible,.reco:focus-visible,.cand:focus-visible,.hintq:focus-visible,
.knob:focus-visible{outline:2px solid var(--target);outline-offset:1px}
select:focus,input:focus{outline:none}
select:focus-visible,input:focus-visible{outline-offset:0;border-color:var(--target)}
.btn.primary{color:#06121f;background:var(--measure);border-color:var(--measure);font-weight:600}
.btn.danger{color:#fff;background:var(--critical);border-color:var(--critical);font-weight:600}
.btn.danger:hover{filter:brightness(1.08)}
.btn.hasnew{position:relative;border-color:var(--target);color:var(--ink)}
.btn.hasnew::after{content:"";position:absolute;top:-3px;right:-3px;width:8px;height:8px;
  border-radius:50%;background:var(--target)}
.spacer{margin-left:auto}

/* ---- hero (main view) ---- */
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink-3);margin:0 0 var(--s2)}
.gap-row{display:flex;align-items:baseline;gap:var(--s4);flex-wrap:wrap}
.hero{font-family:var(--mono);font-size:38px;font-weight:700;line-height:1;
  letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.hero.over{color:var(--critical-ink)} .hero.under{color:var(--caution)} .hero.ok{color:var(--ok)}
.gap-sub{font-size:14px;color:var(--ink-2)}
.gap-sub b{color:var(--ink);font-family:var(--mono);font-weight:600}
.bullet-track{position:relative;height:22px;background:var(--sunken);margin-top:var(--s2);
  border:1px solid var(--line-soft);border-radius:3px;overflow:hidden}
.bullet-fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#25405c,#3a6a9e)}
.bullet-over{position:absolute;top:0;bottom:0;background:var(--critical);opacity:.85}
.bullet-tick{position:absolute;top:-4px;bottom:-4px;width:3px;background:var(--target)}
.bullet-scale{display:flex;justify-content:space-between;margin-top:3px;
  font-family:var(--mono);font-size:11px;color:var(--ink-3)}

.reality{background:var(--raised);border:1px solid var(--line);border-radius:4px;
  padding:var(--s3) var(--s4);overflow:auto;max-height:116px}
.reality.crit{border-left:3px solid var(--critical)}
.reality h3{margin:0 0 6px;font-size:13px;font-weight:600}
.reality p{margin:0;font-size:12px;color:var(--ink-2)}
.wf{margin-top:var(--s2);display:flex;flex-direction:column;gap:3px}
.wf-row{display:grid;grid-template-columns:120px 1fr 54px;gap:var(--s2);align-items:center;
  font-family:var(--mono);font-size:11px;color:var(--ink-2)}
.wf-name{color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wf-bar{height:8px;border-radius:2px 4px 4px 2px;min-width:2px;background:var(--caution)}
.wf-bar.gap{background:var(--critical)}
.wf-sum{border-top:1px solid var(--line);margin-top:5px;padding-top:5px}

/* ---- transport ---- */
.transport{display:flex;align-items:center;gap:var(--s3);padding:var(--s2) var(--s4);flex:none;
  border-bottom:1px solid var(--line);background:var(--surface)}
.seg{display:flex;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.seg button{background:var(--raised);color:var(--ink-2);border:0;border-right:1px solid var(--line);
  padding:6px 12px;cursor:pointer}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--measure);color:#06121f;font-weight:600}
.meta{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.minimap{position:relative;height:40px;flex:1;background:var(--sunken);
  border:1px solid var(--line-soft);border-radius:3px;overflow:hidden;cursor:pointer}
.mm-view{position:absolute;top:-1px;bottom:-1px;border:2px solid var(--ink);
  background:rgba(240,243,246,.09);border-radius:2px;pointer-events:none}

/* ---- lanes ---- */
/* min-height:0 is what lets a flex child scroll instead of pushing the rest of
   the column off-screen; the floor keeps ENERGY and SECTIONS -- both Tier 1 --
   on screen at the shortest window we support. */
.scroll{flex:1 1 auto;min-height:400px;overflow:auto;background:var(--surface)}
/* the lanes share the column: TRACKS and SECTIONS keep their size, ENERGY takes
   whatever height is left, so all three stay visible at any window height */
.canvas{position:relative;padding-bottom:var(--s2);display:flex;flex-direction:column;
  min-height:100%}
.lane-h{position:sticky;left:0;padding:var(--s2) var(--s4) 2px;font-size:11px;font-weight:600;
  letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);width:max-content}
.ruler{position:relative;height:20px;border-bottom:1px solid var(--line-soft)}
.rmark{position:absolute;top:0;bottom:0;border-left:1px solid var(--line-soft);padding-left:5px;
  font-family:var(--mono);font-size:11px;color:var(--ink-3);line-height:20px;white-space:nowrap}
.ruler,.tracks,.sections,.lane-h{flex:none}
/* TRACKS is a ruler for the ENERGY lane below: which track is playing where,
   and how long each one runs. Two greys, alternating per track, so the eye can
   count blocks without a colour key. The phrase colours moved into the
   double-click sheet (2026-09-16 review). */
.tracks{position:relative;height:44px}
.trk{position:absolute;top:0;bottom:0;overflow:hidden;cursor:pointer;
  border-right:1px solid var(--sunken);background:#2a313a}
.trk.alt{background:#3a4350}
.ph{position:absolute;top:0;bottom:0}
.trk .none,.phrase-strip .none{position:absolute;inset:0;
  background:repeating-linear-gradient(45deg,#2a3038 0 6px,#20262d 6px 12px)}
.phrase-strip{position:relative;height:30px;border-radius:3px;overflow:hidden;
  background:var(--sunken);border:1px solid var(--line-soft);margin:var(--s2) 0 var(--s3)}
.ph-list{display:flex;flex-wrap:wrap;gap:5px var(--s4);font-size:12px;color:var(--ink-2)}
.ph-list b{font-family:var(--mono);font-weight:500;color:var(--ink-3);margin-left:4px}
.trk-t{position:absolute;left:5px;right:4px;top:3px;font-size:11px;font-weight:600;color:var(--ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.trk-m{position:absolute;left:5px;bottom:3px;font-family:var(--mono);font-size:11px;
  color:var(--ink-3);pointer-events:none}
.trk[data-sel="1"]{outline:2px solid var(--ink);outline-offset:-2px;z-index:3}
.energy{position:relative;flex:1 1 auto;min-height:92px}
.sections{position:relative;height:58px}
.sec{position:absolute;top:0;bottom:0;border-left:1px solid var(--line);padding:3px 8px;
  overflow:hidden}
.sec-n{font-size:11px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec-b{position:relative;height:10px;background:var(--sunken);border-radius:2px;margin-top:4px}
.sec-f{position:absolute;left:0;top:0;bottom:0;background:#3a6a9e;border-radius:2px 4px 4px 2px}
.sec-t{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--target)}
.sec-v{font-family:var(--mono);font-size:11px;margin-top:2px;color:var(--ink-2)}
.sec-v .o{color:var(--critical-ink)} .sec-v .u{color:var(--caution)}
.mile{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);z-index:4}
.mile::before{content:"";position:absolute;top:0;left:-5px;border:6px solid transparent;
  border-top-color:var(--ink);border-bottom:0}
.tline{position:absolute;top:0;bottom:0;border-left:2px dashed var(--target);z-index:4}
.knob{cursor:grab}
.knob:active{cursor:grabbing}

/* ---- footer ---- */
.foot{padding:var(--s3) var(--s4);border-top:1px solid var(--line);background:var(--surface);
  flex:none}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px var(--s3);margin-top:var(--s2);font-size:12px}
.kv dt{color:var(--ink-3)} .kv dd{margin:0;font-family:var(--mono);font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:6px var(--s4);padding:6px var(--s4);flex:none;
  border-top:1px solid var(--line);background:var(--surface);font-size:11px;color:var(--ink-2)}
.lg{display:flex;align-items:center;gap:5px}
.sw{width:20px;height:10px;border-radius:2px}
.sw.hatch{background:repeating-linear-gradient(45deg,#2a3038 0 4px,#20262d 4px 8px)}

/* ---- inspector controls ---- */
.edit{display:flex;flex-direction:column;gap:6px;margin-top:var(--s3);padding-top:var(--s3);
  border-top:1px solid var(--line-soft)}
.edit label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-3)}
.edit select,.edit input[type=text]{background:var(--surface);color:var(--ink);
  border:1px solid var(--line);border-radius:3px;padding:4px 6px;font-size:12px}
.edit input[type=text]{width:78px;font-family:var(--mono);text-align:center}
.locks{display:flex;gap:var(--s3)}
.locks label{color:var(--ink-2)}

/* ---- drag ---- */
.trk.dragging{opacity:.45}
.dropline{position:absolute;top:-4px;bottom:-4px;width:3px;background:var(--target);
  z-index:6;pointer-events:none;border-radius:2px}

/* ---- agent drawer (Tier 2: it appears when asked for, over the timeline) ---- */
.drawer{position:fixed;top:0;right:0;bottom:0;width:430px;max-width:92vw;z-index:22;
  background:var(--raised);border-left:1px solid var(--line);
  box-shadow:-18px 0 44px rgba(0,0,0,.45);
  display:flex;flex-direction:column;gap:var(--s2);padding:var(--s3) var(--s4) var(--s4)}
.dw-head{display:flex;align-items:center;gap:var(--s3);flex:none}
.dw-head h2{margin:0;font-size:14px;font-weight:600;letter-spacing:0;text-transform:none;
  color:var(--ink)}
.dw-head label{display:flex;align-items:center;gap:5px;margin-left:auto;font-size:12px;
  color:var(--ink-3)}
.dw-head select{background:var(--surface);color:var(--ink);border:1px solid var(--line);
  border-radius:3px;padding:3px 6px;font-size:12px}
.dw-status{margin:0;font-size:12px;color:var(--ink-3);flex:none;
  border-bottom:1px solid var(--line-soft);padding-bottom:var(--s2)}
.chat{flex:1 1 auto;min-height:80px;overflow:auto;display:flex;flex-direction:column;gap:7px;
  padding-right:2px}
.msg{font-size:13px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.msg.you{color:var(--ink);background:var(--surface);border-left:2px solid var(--measure);
  padding:5px 9px;border-radius:0 4px 4px 0}
.msg.agent{color:var(--ink-2)}
.msg.meta{color:var(--ink-3);font-size:11px;font-family:var(--mono)}
.dw-ask{display:flex;gap:var(--s2);flex:none}
.dw-ask input{flex:1;background:var(--surface);color:var(--ink);border:1px solid var(--line);
  border-radius:3px;padding:7px 9px;font-size:13px}
.cand{width:100%;display:grid;grid-template-columns:1fr 54px 44px 56px;gap:var(--s2);
  align-items:center;background:var(--surface);border:1px solid var(--line-soft);
  border-radius:3px;padding:5px 8px;font-family:var(--mono);font-size:11px;color:var(--ink-2);
  cursor:pointer;text-align:left}
.cand:hover{border-color:var(--measure);color:var(--ink)}
.cand span:first-child{font-family:var(--sans);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.cand-list{display:flex;flex-direction:column;gap:3px;margin-top:5px;max-height:130px;
  overflow:auto}
.card{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--target);
  border-radius:4px;padding:var(--s3);margin-top:var(--s2)}
.card h3{margin:0 0 5px;font-size:13px;font-weight:600;color:var(--ink)}
.card .why{font-size:12px;color:var(--ink-2);margin:0 0 var(--s2)}
.card label{display:grid;grid-template-columns:16px 1fr;gap:7px;align-items:start;
  font-size:12px;color:var(--ink-2);margin-bottom:4px;cursor:pointer}
.card .diff{font-family:var(--mono);font-size:11px;color:var(--ink-3);
  border-top:1px solid var(--line-soft);margin-top:var(--s2);padding-top:var(--s2);
  display:flex;flex-direction:column;gap:2px}
.card .acts{display:flex;gap:var(--s2);margin-top:var(--s3)}
.sec-title{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink-3);margin:var(--s2) 0 0}
.plog{margin:0;font-size:11px;color:var(--ink-3);font-family:var(--mono);flex:none}
/* the proposal drawn over the set before anything is applied (S4-3) */
.ghost{position:absolute;top:0;bottom:0;border:1px dashed var(--target);
  background:rgba(247,120,186,.13);pointer-events:none;z-index:2}

/* ---- modal ---- */
.modal{position:fixed;inset:0;background:rgba(6,9,12,.72);display:grid;place-items:center;
  z-index:25;padding:var(--s4)}
.sheet{background:var(--raised);border:1px solid var(--line);border-radius:6px;
  padding:var(--s5);max-width:720px;width:100%;max-height:82vh;overflow:auto}
.sheet h2{margin:0 0 var(--s3);font-size:16px;font-weight:600;letter-spacing:0;
  text-transform:none;color:var(--ink)}
.sheet pre{background:var(--sunken);border:1px solid var(--line-soft);border-radius:4px;
  padding:var(--s3);font-family:var(--mono);font-size:12px;color:var(--ink-2);
  white-space:pre-wrap;margin:0}
.sheet p{color:var(--ink-2);font-size:13px;margin:0 0 var(--s3)}
.sheet .field{display:flex;flex-direction:column;gap:5px;margin-bottom:var(--s3)}
.sheet .field span{font-size:12px;color:var(--ink-3)}
.sheet .field input{background:var(--surface);color:var(--ink);border:1px solid var(--line);
  border-radius:3px;padding:7px 9px;font-family:var(--mono);font-size:13px}
.mActions{display:flex;gap:var(--s2);justify-content:flex-end;margin-top:var(--s4)}
.hint{font-size:12px;color:var(--ink-3);margin-top:var(--s2)}
.hintq{color:var(--measure);text-decoration:none}
.hintq:hover,.hintq:focus-visible{text-decoration:underline}
.hint.warn{color:var(--caution)}
.steps{margin:0;padding-left:1.3em;font-size:13px;color:var(--ink-2)}
.steps li{margin-bottom:5px}
.steps b{color:var(--ink)}

/* ---- boot / error ---- */
.curtain{position:fixed;inset:0;display:grid;place-items:center;background:var(--page);z-index:20}
.curtain .box{max-width:620px;padding:var(--s6);text-align:left}
.curtain h1{font-size:18px;margin:0 0 var(--s3)}
.curtain p{color:var(--ink-2);margin:0 0 var(--s3)}
.curtain pre{background:var(--raised);border:1px solid var(--line);border-radius:4px;
  padding:var(--s3);font-family:var(--mono);font-size:11px;color:var(--ink-2);
  white-space:pre-wrap;max-height:240px;overflow:auto}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--raised);
  border:1px solid var(--line);border-left:3px solid var(--caution);border-radius:4px;
  padding:9px 15px;font-size:13px;z-index:30;max-width:70vw}
/* Hover window for artwork (2026-09-17, user decision: not fixed in the lanes).
   Fixed-position so it can leave the scrolled lane; pointer-events off so it
   never steals the hover that opened it. */
.artpop{position:fixed;z-index:28;padding:4px;background:var(--raised);border:1px solid var(--line);
  border-radius:6px;box-shadow:0 6px 24px rgba(0,0,0,.45);pointer-events:none}
.artpop img{display:block;width:120px;height:120px;border-radius:4px;object-fit:cover;background:var(--sunken)}
/* ---- main view: the panel a DJ keeps beside rekordbox ----
   Only what they came to read: the set's predicted length, whether it fits, the
   way into recommendations, the conditions they set, and the running order.
   Everything analytical lives in the detail view. Must hold at ~380px wide. */
.main{flex:1 1 auto;min-height:0;overflow:auto;display:flex;flex-direction:column;
  gap:var(--s4);padding:var(--s4);background:var(--surface)}
.hero-block .hero{font-size:56px;color:var(--ink)}
.hero-block .hero.over{color:var(--critical-ink)} .hero-block .hero.under{color:var(--caution)}
.hero-block .gap-sub{margin-top:var(--s2);display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap}
.pill{display:inline-block;padding:1px 9px;border-radius:999px;font-family:var(--mono);font-size:12px;
  font-weight:600;background:var(--raised);color:var(--ink-2);border:1px solid var(--line)}
.pill.over{color:#fff;background:var(--critical);border-color:var(--critical)}
.pill.under{color:#06121f;background:var(--caution);border-color:var(--caution)}
.pill.ok{color:#06121f;background:var(--ok);border-color:var(--ok)}
.reco{display:grid;grid-template-columns:1fr auto;align-items:center;gap:var(--s3);text-align:left;
  background:var(--raised);border:1px solid var(--line);border-left:3px solid var(--measure);
  border-radius:4px;padding:var(--s3) var(--s4);color:var(--ink);cursor:pointer;font:inherit}
.reco:hover{border-color:#3d4550}
.reco.over:hover{border-left-color:var(--critical)} .reco.under:hover{border-left-color:var(--caution)}
.reco.ok:hover{border-left-color:var(--ok)}
.reco.over{border-left-color:var(--critical)} .reco.under{border-left-color:var(--caution)}
.reco.ok{border-left-color:var(--ok)}
.reco h3{margin:0;font-size:14px;font-weight:600;line-height:1.35}
.reco p{margin:3px 0 0;font-size:12px;line-height:1.5;color:var(--ink-2);max-width:60ch}
.reco .go{font-size:12px;color:var(--measure);white-space:nowrap}
.cond-row{display:flex;flex-wrap:wrap;gap:var(--s2) var(--s3)}
.cond-row label{display:flex;align-items:center;gap:6px;color:var(--ink-3);font-size:12px}
.cond-row select,.cond-row input[type=text]{background:var(--raised);color:var(--ink);
  border:1px solid var(--line);border-radius:3px;padding:4px 7px}
.cond-row input[type=text]{width:70px;font-family:var(--mono);text-align:center}
.cond-row #setBpm{width:96px}
.cond-row select,.cond-row input[type=text]{height:28px}
.list-note{margin:0 0 var(--s2);font-size:12px;line-height:1.5;color:var(--ink-2);max-width:60ch}
/* BPM change points: "from track N on, the set runs at X" */
.bpmv{margin-top:var(--s2);border:1px solid var(--line-soft);border-radius:4px;padding:var(--s2) var(--s3);
  display:flex;flex-direction:column;gap:6px;background:var(--sunken)}
.bpmv .cp{display:grid;grid-template-columns:minmax(0,1fr) 64px auto;gap:var(--s2);align-items:center;font-size:12px}
.bpmv .cp .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2)}
.bpmv .cp b{font-family:var(--mono);font-weight:600;text-align:right}
.bpmv .cp .btn{padding:2px 8px;font-size:11px}
.bpmv .addcp{display:grid;grid-template-columns:minmax(0,1fr) auto 64px auto;gap:var(--s2);align-items:center}
.bpmv .addcp #cpFrom{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
#setBpm.auto{color:var(--ink-2)}
#setBpmAuto{margin-left:4px;font-size:11px}
.minimap[hidden]{display:none}
.bpmv select,.bpmv input[type=text]{background:var(--raised);color:var(--ink);border:1px solid var(--line);
  border-radius:3px;padding:3px 6px;font-size:12px;min-width:0}
.bpmv input[type=text]{font-family:var(--mono);text-align:center}
.bpmv .none-yet{font-size:11px;color:var(--ink-3);margin:0}
.field select{background:var(--raised);color:var(--ink);border:1px solid var(--line);border-radius:3px;
  padding:4px 6px;font-size:12px;height:28px}
.conn{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap;margin:0 0 var(--s2);font-size:12px;line-height:1.5}
.conn .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ink-3);flex:none}
.conn .dot.on{background:var(--ok)}
.conn .dot.warn{background:var(--caution)}
.conn .btn{padding:2px 8px;font-size:11px}
.pill.bpm{color:var(--ink);background:var(--raised)}
.list{display:flex;flex-direction:column;border:1px solid var(--line-soft);border-radius:4px;overflow:hidden}
.row,.list-h{display:grid;grid-template-columns:28px minmax(0,1fr) 56px 56px;gap:var(--s2);
  align-items:center;padding:6px var(--s3)}
.row .art{width:28px;height:28px;border-radius:4px;background:var(--raised);overflow:hidden;display:block}
.row .art img{width:100%;height:100%;object-fit:cover;display:block}
.list-h{padding:4px var(--s3);font-size:11px;font-weight:600;letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink-3);background:var(--sunken)}
.list-h span:nth-child(n+3){text-align:right}
.row{border-top:1px solid var(--line-soft);font-size:12px;cursor:pointer;background:var(--surface)}
.row:hover{background:var(--raised)}
.row[data-sel="1"]{background:var(--raised);box-shadow:inset 3px 0 0 var(--ink)}
.row .n{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.row .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.row .t small{color:var(--ink-3);font-family:var(--mono);margin-left:6px;font-size:11px}
.row .t .why{display:block;font-size:11px;line-height:1.35;margin-top:1px;color:var(--ink-3);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--sans)}
.row .d,.row .at{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;color:var(--ink-2)}
.row .at{color:var(--ink-3)}
/* removal rows: the clock after taking that track out turns green once it is
   inside the target, so the eye finds "from here down is enough" */
.row.fits .at{color:var(--ok)}
.row .d.minus{color:var(--caution)}
.fresh{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap;margin-bottom:var(--s3)}
.fresh .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:6px}
.fresh .dot.rb{background:var(--caution)}
.views button{padding:5px 10px}
.bar .btn{padding:5px 9px;white-space:nowrap}
.bar .btn.glyph{font-size:15px;line-height:1;padding:3px 8px;min-width:30px}

/* ---- detail view: the analysis, one scrolling column ---- */
/* one scrolling column: the lanes keep their floor, the rest follows below */
.detail{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;overflow:auto}
.reality-row{padding:var(--s2) var(--s4);border-top:1px solid var(--line);background:var(--surface);flex:none}
.reality-row .reality{max-height:140px}

[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>
<body>

<div class="app" id="app" hidden>
  <div class="bar">
    <div class="seg views" role="group" aria-label="表示">
      <button type="button" data-view="main" aria-pressed="true"
        title="セット画面: 予測時間と、目標に合わせるための候補">セット</button>
      <button type="button" data-view="detail" aria-pressed="false"
        title="詳細画面: 曲ごとの尺と展開（エネルギー）の対応、区間の予算">詳細</button>
    </div>
    <span class="spacer"></span>
    <button class="btn glyph" id="undo" aria-label="元に戻す"
      title="元に戻す: Set Agent 内での試行を 1 つ戻します（rekordbox には影響しません）">↶</button>
    <button class="btn glyph" id="redo" aria-label="やり直す" title="やり直す: 戻した試行をもう一度行います">↷</button>
    <button class="btn" id="agentBtn"
      title="エージェント: 分析の数値をもとに質問に答え、提案（チェックして適用）を出します">エージェント</button>
    <button class="btn" id="settings"
      title="設定: rekordbox ライブラリの手動再読込、エージェントの LLM キー">設定</button>
  </div>

  <!-- ===== main view (Tier 1 only) ===== -->
  <!-- read top to bottom: what you asked for (conditions) -> what it adds up
       to (predicted length) -> what to do about the gap (card + candidates) -->
  <section class="main" id="main">
    <div>
      <p class="eyebrow">条件</p>
      <div class="cond-row">
        <label title="尺を予測する rekordbox のプレイリスト。rekordbox 側で編集すると自動で追従します">
          Playlist <select id="pl"></select></label>
        <label title="目標のセット時間（mm:ss）。予測時間との差を超過・不足で表示します">
          Target Time <input type="text" id="target" value="60:00"></label>
        <label title="Mix: 1 曲をどこからどこまでかける前提で尺を予測するか（フレーズ解析から再生範囲を決めます）">
          Mix <select id="preset"></select></label>
        <label title="Curve: セット全体で目指す展開（盛り上がりの形）。詳細画面の ENERGY に点線で重なり、実測とのズレを出します">
          Curve <select id="curve"></select><span class="meta" id="curveEdited"></span></label>
        <label id="cap32Lbl"
          title="1ドロップ/2ドロップ のとき、32 小節を超える長いドロップを 32 小節で切り上げます（コーラス 1 つが曲の大半を占める曲向け）">
          <input type="checkbox" id="cap32"> ドロップ上限 32 小節</label>
        <label title="セットをかける BPM。プレイリストの曲をすべてこの BPM でかける前提で尺を予測します（原曲と違う曲は伸び縮みします）。何も入れていないときはプレイリストの BPM 中央値です。空欄に戻すと中央値に戻ります">
          Target BPM <input type="text" id="setBpm" placeholder="BPM"><span class="meta" id="setBpmAuto"></span></label>
        <label id="bpmVarLbl" title="セットの途中で BPM を変えるとき。どの曲から何 BPM にするかを指定します">
          <input type="checkbox" id="bpmVar"> BPM 変化あり</label>
      </div>
      <div class="bpmv" id="bpmv" hidden>
        <div id="cpList"></div>
        <div class="addcp">
          <select id="cpTrack" title="この曲から BPM を変える"></select>
          <span class="meta" id="cpFrom" title="この変化点の直前まで効いている BPM"></span>
          <input type="text" id="cpBpm" placeholder="BPM" title="この曲からの BPM">
          <button class="btn" id="cpAdd" title="変化点を追加">追加</button>
        </div>
      </div>
    </div>

    <div class="hero-block" title="今のプレイリストを Mix の前提でかけたときの合計時間（曲間のオーバーラップ込み）">
      <p class="eyebrow">セット全体の予測時間</p>
      <div class="hero" id="hero">—</div>
      <div class="gap-sub" id="heroSub"></div>
      <div class="bullet-track" title="予測時間（塗り）と目標（縦線）。目標を越えた分は赤">
        <div class="bullet-fill" id="bFill"></div>
        <div class="bullet-over" id="bOver"></div>
        <div class="bullet-tick" id="bTick"></div>
      </div>
      <div class="bullet-scale"><span>0:00</span><span id="bTargetLbl"></span><span id="bTotalLbl"></span></div>
    </div>

    <button class="reco" id="reco" type="button" hidden
      title="今の状態に応じた次の一手。押すとエージェントにその指示を送ります"></button>

    <div id="listBlock" hidden>
      <p class="eyebrow" id="listHead"></p>
      <p class="list-note" id="listNote"></p>
      <div class="list" id="list"></div>
    </div>
  </section>

  <!-- ===== detail view (Tier 2: on demand) ===== -->
  <section class="detail" id="detail" hidden>
  <div class="transport">
    <div class="seg" role="group" aria-label="時間軸の密度" title="時間軸の密度。全体=1分36px / 詳細=1分96px（曲名が出ます）。どちらも横スクロール">
      <button type="button" data-zoom="section" aria-pressed="true">全体</button>
      <button type="button" data-zoom="detail" aria-pressed="false">詳細</button>
    </div>
    <span class="meta" id="density"></span>
    <div class="minimap" id="minimap" title="セット全体の縮図。クリックやドラッグで表示位置を移動"><div class="mm-view" id="mmView"></div></div>
  </div>

  <div class="scroll" id="scroll">
    <div class="canvas" id="canvas">
      <div class="lane-h" title="曲の並びと尺。幅＝再生時間。ダブルクリックでその曲のフレーズ構成を表示。ドラッグで並べ替え、端をドラッグで範囲を詰める試行">Tracks — 曲と尺</div>
      <div class="ruler" id="ruler"></div>
      <div class="tracks" id="tracks"></div>
      <div class="lane-h" title="実測の展開（フレーズ解析から）と、Curve で選んだ目標カーブ（点線）。点はドラッグ、ダブルクリックで追加、右クリックで削除">Energy — 実測とターゲット</div>
      <div class="energy" id="energy"></div>
      <div class="lane-h" title="マイルストーンで区切った区間ごとの曲数・尺・目標との過不足">Sections — 区間予算</div>
      <div class="sections" id="sections"></div>
    </div>
  </div>

  <div class="legend">
    <span class="lg"><i class="sw hatch"></i>フレーズ解析なし</span>
    <span class="lg"><i class="sw" style="background:var(--target)"></i>目標</span>
    <span class="lg"><i class="sw" style="border:1px dashed var(--target);background:rgba(247,120,186,.13)"></i>提案後</span>
    <span class="lg" style="color:var(--ink-3)">曲をダブルクリックでフレーズ構成</span>
    <span class="lg" id="analysisMeta" style="margin-left:auto;font-family:var(--mono)"></span>
  </div>

  <div class="reality-row"><div class="reality" id="reality"></div></div>

  <div class="foot">
    <div>
      <p class="eyebrow" title="選んだ曲の位置・再生尺・BPM・フレーズ">選択中</p>
      <div id="selTitle" style="font-weight:600;font-size:13px">—</div>
      <dl class="kv" id="selKv"></dl>
    </div>
  </div>
  </section>
</div>

<div class="curtain" id="curtain">
  <div class="box">
    <h1 id="cTitle">ライブラリを読み込んでいます…</h1>
    <p id="cMsg">rekordbox の master.db を復号して開いています。初回は少し時間がかかります。</p>
    <pre id="cDetail" hidden></pre>
    <button class="btn primary" id="cRetry" hidden>もう一度試す</button>
  </div>
</div>

<aside class="drawer" id="drawer" hidden aria-label="エージェント">
  <div class="dw-head">
    <h2>エージェント</h2>
    <label>介入度 <select id="level"></select></label>
    <button class="btn" id="dwClose">閉じる</button>
  </div>
  <p class="dw-status" id="agentStatus"></p>
  <div class="chat" id="chat"></div>
  <div class="dw-ask">
    <input type="text" id="askText" placeholder="質問や指示を書く">
    <button class="btn primary" id="askSend">送る</button>
  </div>
  <p class="hint" id="askHints"></p>
  <div id="cands"></div>
  <div id="pending"></div>
  <p class="plog" id="plog"></p>
</aside>

<div class="modal" id="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <h2 id="mTitle"></h2>
    <div id="mBody"></div>
    <div class="mActions" id="mActions"></div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>
<!-- artwork on hover: one image, no text (the native title carries the words) -->
<div class="artpop" id="artpop" hidden aria-hidden="true"><img alt=""></div>

<script>
const $ = id => document.getElementById(id);
/* px per minute. The 3px "overview" left on 2026-09-16: it squeezed 137 minutes
   into 400px and read as noise; the minimap already gives the whole-set view. */
/* "全体" fits the whole set to the lane width (no horizontal scroll; the panel
   lives beside rekordbox as a tall window, review 2026-09-17); "詳細" is 96px/min */
const DENSITY = {section:null, detail:96};
const PH_COLOR = {intro:"var(--ph-intro)", up:"var(--ph-up)", chorus:"var(--ph-chorus)",
                  down:"var(--ph-down)", outro:"var(--ph-outro)", verse:"var(--ph-verse)"};
let ST = null, BOOT = null, mode = "section", toastTimer = null;
let VIEW = "main", LOADED_AT = null;
let PRESET_LABEL = {}, PRESET_HELP = {};
const plabel = k => PRESET_LABEL[k] || k;
const popt = k => `<option value="${esc(k)}" title="${esc(PRESET_HELP[k] || "")}">${esc(plabel(k))}</option>`;
/* the drop cap only means something when the preset is built around drops */
const capApplies = () => ["one_drop", "two_drop"].includes($("preset").value);

const fmt = s => {
  const n = Math.round(Math.abs(s));
  return (s < 0 ? "-" : "") + Math.floor(n/60) + ":" + String(n%60).padStart(2,"0");
};
/* fit mode: the canvas is width:100% of the scroll box, so its own clientWidth
   (measured after layout, scrollbar included) is the truth -- not the box's */
function laneWidth(){ return Math.max($("canvas").clientWidth || $("scroll").clientWidth || 400, 200); }
const pps = () => mode === "section"
  ? laneWidth() / Math.max(ST ? ST.total_s : 1, 1)
  : DENSITY[mode] / 60;
/* narrowest block that still shows a label: 5px + 4px padding, one 11px glyph, "…" */
const LABEL_MIN_PX = 24;

function toast(msg){
  const t = $("toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>{t.hidden = true}, 4200);
}
function fail(title, msg, detail){
  $("curtain").hidden = false; $("app").hidden = true;
  $("cTitle").textContent = title; $("cMsg").textContent = msg;
  $("cDetail").hidden = !detail; $("cDetail").textContent = detail || "";
  $("cRetry").hidden = false;
}

/* ---------------- boot ---------------- */
async function boot(){
  const b = await window.pywebview.api.boot();
  if(b.error){
    fail("ライブラリを開けません", b.error + "\n\nrekordbox を一度起動してライブラリを作成してから、もう一度お試しください。",
         b.detail);
    return;
  }
  BOOT = b;
  PRESET_LABEL = b.preset_labels || {}; PRESET_HELP = b.preset_help || {};
  $("setBpm").value = b.set_bpm ? String(b.set_bpm) : "";
  $("pl").innerHTML = b.playlists.map(n=>`<option>${esc(n)}</option>`).join("");
  if(b.playlist) $("pl").value = b.playlist;
  $("preset").innerHTML = b.presets.map(popt).join("");
  $("preset").value = b.preset;
  $("cap32").checked = !!b.cap32;
  $("cap32Lbl").hidden = !capApplies();
  $("curve").innerHTML = `<option value="">（なし）</option>` +
    b.curves.map(c=>`<option value="${esc(c.key)}">${esc(c.label)}</option>`).join("");
  $("target").value = fmt(b.target_s);
  await reload();
  startPolling();
}

function targetSeconds(){
  const m = /^(\d+):(\d{1,2})$/.exec($("target").value.trim());
  return m ? (+m[1])*60 + (+m[2]) : 3600;
}

async function reload(){
  $("cTitle").textContent = "セットを組んでいます…";
  $("cMsg").textContent = "フレーズ解析を読んで再生範囲を決めています。";
  $("curtain").hidden = false;
  const s = await window.pywebview.api.load({
    playlist: $("pl").value, preset: $("preset").value,
    cap32: $("cap32").checked, target_s: targetSeconds(),
  });
  LOADED_AT = new Date();
  apply(s, true);
}

function apply(s, firstPaint){
  if(!s){ return; }
  /* only boot/load failures take over the screen; an ordinary refusal is a toast */
  if(s.fatal){ fail("読み込みに失敗しました", s.error, s.detail); return; }
  if(s.error && !s.tracks){ toast(s.error); return; }
  if(s.error) toast(s.error);
  if(s.notice) toast(s.notice);
  ST = s;
  $("curtain").hidden = true; $("app").hidden = false;
  render();
  if(firstPaint) $("scroll").scrollLeft = 0;
}

/* ---------------- render ---------------- */
const esc = t => String(t).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function render(){
  renderHero();
  renderReco();
  renderList();
  renderFresh();
  renderReality();
  renderLanes();
  renderMinimap();
  renderMeta();
  renderSelected();
  renderAgent();
  syncView();
}

/* ---------------- view switch ---------------- */
function setView(v){
  VIEW = v;
  $("main").hidden = v !== "main";
  $("detail").hidden = v !== "detail";
  document.querySelectorAll("[data-view]").forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.view === v)));
  /* the lanes size themselves from the DOM, which is 0 while hidden */
  if(v === "detail" && ST){ renderLanes(); renderMinimap(); syncView(); }
}
document.querySelectorAll("[data-view]").forEach(b =>
  b.addEventListener("click", ()=> setView(b.dataset.view)));

/* ---------------- agent drawer ---------------- */
/* these are worded to hit the advisor's own vocabulary, so a DJ who clicks one
   always gets a real answer instead of "その言い方はまだ解釈できない" */
const HINTS = ["今のセット何分？", "バランスどう？", "ピークはどこ？",
               "候補を出して", "区間の余白は？", "60:00 に収めて"];

function renderAgent(){
  const a = ST.agent || {};
  if(!a.ready){ $("agentStatus").textContent = "セットを読み込むと使えます"; return; }

  $("agentStatus").textContent = a.status;
  if($("level").options.length !== (a.levels || []).length){
    $("level").innerHTML = (a.levels || []).map(l =>
      `<option value="${esc(l)}">${esc(l)}</option>`).join("");
  }
  $("level").value = a.level;

  const c = $("chat");
  const atBottom = c.scrollHeight - c.scrollTop - c.clientHeight < 40;
  c.innerHTML = (a.chat || []).map(m =>
    `<div class="msg ${esc(m.who)}">${esc(m.text)}</div>`).join("") ||
    `<div class="msg meta">まだ会話はありません。下の例をそのまま送ることもできます。</div>`;
  if(atBottom) c.scrollTop = c.scrollHeight;

  $("askHints").innerHTML = "例: " + HINTS.map(h =>
    `<a href="#" class="hintq" data-q="${esc(h)}">${esc(h)}</a>`).join(" · ");

  $("cands").innerHTML = !(a.candidates || []).length ? "" :
    `<p class="sec-title">候補（クリックで挿入案）</p><div class="cand-list">` +
    a.candidates.map(x => `<button class="cand" data-id="${esc(x.track_id)}">
        <span title="${esc(x.title)}">${esc(x.title)}</span>
        <span>${(+x.bpm).toFixed(1)}</span><span>${esc(x.key || "")}</span>
        <span>${esc(x.in_slot || "")}</span></button>`).join("") + `</div>`;

  const p = a.pending;
  $("pending").innerHTML = !p ? "" :
    `<div class="card">
       <h3>${esc(p.title || "提案")}</h3>
       ${p.reason ? `<p class="why">${esc(p.reason)}</p>` : ""}
       ${p.items.map(it => `<label><input type="checkbox" class="op" data-i="${it.i}"
           ${it.approved ? "checked" : ""}><span>${esc(it.text)}</span></label>`).join("")}
       <div class="diff">${p.diff.map(l => `<span>${esc(l)}</span>`).join("")}</div>
       <div class="acts">
         <button class="btn primary" id="applyPending">チェックした操作を適用</button>
         <button class="btn" id="rejectPending">却下</button>
       </div>
     </div>`;

  $("plog").textContent = a.log || "";

  /* a proactive notice is worthless if the drawer is shut and nothing says so */
  const n = (a.chat || []).length;
  if($("drawer").hidden && n > seenMsgs) $("agentBtn").classList.add("hasnew");
  else { $("agentBtn").classList.remove("hasnew"); seenMsgs = n; }
}
let seenMsgs = 0;

/* ---------------- main view ---------------- */
/* The hero is the predicted length itself. A DJ glances here to learn "how long
   is this set", not "how far off am I" -- the gap is one pill underneath. */
const fitClass = d => d == null ? "" : d > ST.tolerance_s ? "over" : d < -ST.tolerance_s ? "under" : "ok";

function renderHero(){
  const d = ST.delta_s, tgt = ST.target_s || 0, tot = ST.total_s;
  const cls = fitClass(d);
  const h = $("hero");
  h.className = "hero " + cls;
  h.textContent = fmt(tot);
  const pill = cls === "over" ? `<span class="pill over">${fmt(d)} 超過</span>`
             : cls === "under" ? `<span class="pill under">${fmt(-d)} 不足</span>`
             : cls === "ok" ? `<span class="pill ok">目標内</span>` : "";
  /* the target itself is read off the bar's scale below; here only the verdict,
     plus the tempo the prediction assumes, since that is what stretches it */
  const chain = [ST.set_bpm, ...(ST.bpm_changes || []).map(c => c.bpm)].filter(v => v != null);
  const bpm = chain.length
    ? `<span class="pill bpm" title="${ST.set_bpm_auto
          ? "プレイリストの BPM 中央値でかける前提の予測です。Target BPM に数字を入れると置き換わります"
          : "この BPM でかける前提の予測です"}">${chain.join(" → ")} BPM${ST.set_bpm_auto ? "（自動）" : ""}</span>`
    : `<span class="pill bpm" title="BPM が分からないため、各曲を原曲の BPM でかける前提の予測です">原曲 BPM</span>`;
  $("heroSub").innerHTML = pill + bpm + `<span style="color:var(--ink-3)">${ST.tracks.length}曲</span>`;
  renderBpmVar();

  const span = Math.max(tot, tgt) || 1;
  $("bFill").style.width = (Math.min(tot,tgt)/span*100) + "%";
  const over = Math.max(0, tot - tgt);
  $("bOver").style.left = (tgt/span*100) + "%";
  $("bOver").style.width = (over/span*100) + "%";
  $("bTick").style.left = (tgt/span*100) + "%";
  $("curveEdited").textContent = ST.curve_edited ? " 編集済み" : "";
  $("bTargetLbl").textContent = "目標 " + fmt(tgt);
  $("bTotalLbl").textContent = fmt(tot);
}

/* One card, worded by state. It is the doorway to recommendations: over -> ask
   the agent to fit the set, under -> ask it for candidates, ok -> go check the
   flow. Nothing here edits the set; the DJ applies changes in rekordbox. */
function renderReco(){
  const d = ST.delta_s, tgt = ST.target_s || 0, tot = ST.total_s, n = ST.tracks.length;
  const r = $("reco"), cls = fitClass(d);
  if(!cls){ r.hidden = true; return; }
  r.hidden = false;
  r.className = "reco " + cls;
  const per = n ? tot / n : 0;
  const k = per ? Math.max(1, Math.round(Math.abs(d) / per)) : 0;
  if(cls === "over"){
    r.dataset.q = `${fmt(tgt)} に収めて`;
    r.innerHTML = `<div><h3>${fmt(d)} 分の短縮が必要です</h3>
      <p>1曲平均 ${fmt(per)} なので、およそ ${k} 曲分です。まず削り代で稼げる分を確認します</p></div>
      <span class="go">削り代と候補 →</span>`;
  } else if(cls === "under"){
    r.dataset.q = "候補を出して";
    r.innerHTML = `<div><h3>${fmt(-d)} 足りません</h3>
      <p>およそ ${k} 曲分です。プレイリストに合う曲をコレクションから探します</p></div>
      <span class="go">足す候補 →</span>`;
  } else {
    r.dataset.q = "";
    r.innerHTML = `<div><h3>目標の範囲に収まっています</h3>
      <p>展開の山谷を詳細で確認してから、rekordbox で USB に書き出してください</p></div>
      <span class="go">詳細を見る →</span>`;
  }
}
$("reco").addEventListener("click", ()=>{
  const q = $("reco").dataset.q;
  if(!q){ setView("detail"); return; }
  openDrawer(true);
  $("askText").value = q;
  send();
});

/* The list under the hero is advice, not the playlist (rekordbox shows that
   already, right next to this panel). Over the target: the playlist's own
   tracks the set would miss least, with the clock after each removal. Under
   it: tracks from outside the playlist that fit the hole. Same engines as the
   agent; the DJ makes the actual change in rekordbox. */
function renderList(){
  const r = ST.reco || {kind: "none", items: []};
  const blk = $("listBlock");
  if(r.kind !== "remove" && r.kind !== "add"){ blk.hidden = true; $("list").innerHTML = ""; return; }
  blk.hidden = false;
  let h = "";
  if(r.kind === "remove"){
    $("listHead").textContent = "外す候補";
    $("listNote").textContent = r.enough
      ? `展開と繋ぎへの影響が小さい順です。上から ${r.items.length} 曲を外すと目標に収まります。ロック中とマイルストーンの曲は含めていません`
      : `全部外しても ${fmt(r.need_s)} には届きません（ロック中とマイルストーンの曲は除く）。目標尺かロックを見直してください`;
    h += `<div class="list-h"><span></span><span>曲</span><span>外すと</span><span>外した後</span></div>`;
    const tgt = ST.target_s || 0;
    for(const it of r.items){
      const fits = tgt && it.after_s <= tgt + ST.tolerance_s;
      h += `<div class="row rm${fits ? " fits" : ""}" tabindex="0" data-i="${it.i}" data-sel="${it.i === ST.selected ? 1 : 0}"
              title="${esc(it.title)}\n${esc(it.reasons.join("\n") || "理由なし")}">
        <span class="art" data-art="${esc(it.track_id)}">${ART[it.track_id] ? `<img src="${ART[it.track_id]}" alt="">` : ""}</span>
        <span class="t">${it.i + 1}. ${esc(it.title)}<span class="why">${esc(it.reasons.join("／"))}</span></span>
        <span class="d minus">−${fmt(it.saves_s)}</span>
        <span class="at">${fmt(it.after_s)}</span></div>`;
    }
  } else {
    $("listHead").textContent = "足す候補";
    $("listNote").textContent = r.items.length
      ? `プレイリスト外から、最後の曲に繋がる BPM・キーで ${fmt(r.slot_s)} 前後に入る曲です。クリックすると挿入案をエージェントで確認できます`
      : `${fmt(r.need_s)} 不足していますが、最後の曲に繋がる BPM・キーの曲がライブラリにありません`;
    h += `<div class="list-h"><span></span><span>曲</span><span>BPM</span><span>尺</span></div>`;
    for(const it of r.items){
      h += `<div class="row add" tabindex="0" data-id="${esc(it.track_id)}"
              title="${esc(it.title)}${it.artist ? " — " + esc(it.artist) : ""}\n${esc(it.reason || "")}">
        <span class="art" data-art="${esc(it.track_id)}">${ART[it.track_id] ? `<img src="${ART[it.track_id]}" alt="">` : ""}</span>
        <span class="t">${esc(it.title)}<span class="why">${esc(it.reason || "")}</span></span>
        <span class="d">${(+it.bpm).toFixed(0)}${it.key ? `<small>${esc(it.key)}</small>` : ""}</span>
        <span class="at">${esc(it.in_slot || "")}</span></div>`;
    }
  }
  $("list").innerHTML = h;
  loadArtwork();
}

/* Artwork: rekordbox's own JPEG per track, downscaled by the bridge into data
   URLs and cached here for the session. Rows render at once and fill in. */
const ART = {};
let artBusy = false;
async function loadArtwork(){
  if(artBusy || !ST) return;
  const ids = ST.tracks.map(t => t.track_id).concat(((ST.reco || {}).items || []).map(it => it.track_id));
  const want = [...new Set(ids)].filter(id => id && !(id in ART));
  if(!want.length) return;
  artBusy = true;
  try {
    for(let i = 0; i < want.length; i += 24){
      const got = await window.pywebview.api.artwork(want.slice(i, i + 24), 56);
      for(const [id, url] of Object.entries(got || {})){
        ART[id] = url;
        if(url) document.querySelectorAll(`.row .art[data-art="${id}"]`).forEach(el => {
          el.innerHTML = `<img src="${url}" alt="">`;
        });
      }
    }
  } catch(e){ /* thumbnails are decoration; the list works without them */ }
  finally { artBusy = false; }
}
$("list").addEventListener("keydown", e=>{
  if((e.key === "Enter" || e.key === " ") && e.target.classList.contains("row")){ e.preventDefault(); e.target.click(); }
});

/* ---- artwork popover ----
   Hovering a track block (.trk) or a candidate row (.row) for a moment opens a
   120px window with that track's artwork, beside the pointer. Bigger thumbnails
   are fetched once per track and kept for the session (ART_L). Nothing opens
   when the track has no artwork. Focus (keyboard) anchors it to the element. */
const ART_L = {}, ART_L_PX = 120, ART_POP_DELAY_MS = 260;
let artPop = {timer: null, id: null};
function artIdOf(node){
  if(!ST) return null;
  if(node.classList.contains("trk")){
    const t = ST.tracks.find(x => x.i === +node.dataset.i);
    return t ? t.track_id : null;
  }
  const a = node.querySelector(".art"); return a ? a.dataset.art : null;
}
function placeArtPop(x, y){
  const p = $("artpop"), m = 14, W = ART_L_PX + 10, H = ART_L_PX + 10;
  let left = x + m, top = y + m;
  if(left + W > innerWidth - 4) left = x - m - W;
  if(top + H > innerHeight - 4) top = y - m - H;
  p.style.left = Math.max(4, left) + "px"; p.style.top = Math.max(4, top) + "px";
}
function hideArtPop(){
  clearTimeout(artPop.timer); artPop.timer = null; artPop.id = null;
  const p = $("artpop"); p.hidden = true; p.setAttribute("aria-hidden", "true");
}
async function showArtPop(id, x, y){
  if(!(id in ART_L)){
    try {
      const got = await window.pywebview.api.artwork([id], ART_L_PX);
      ART_L[id] = (got || {})[id] || "";
    } catch(e){ ART_L[id] = ""; }
  }
  if(artPop.id !== id || !ART_L[id]) return;      /* pointer moved on, or no artwork */
  const p = $("artpop"); p.querySelector("img").src = ART_L[id];
  placeArtPop(x, y); p.hidden = false; p.setAttribute("aria-hidden", "false");
}
function armArtPop(node, x, y){
  const id = artIdOf(node);
  if(!id){ hideArtPop(); return; }
  if(id === artPop.id){ if(!$("artpop").hidden) placeArtPop(x, y); return; }
  hideArtPop(); artPop.id = id;
  artPop.timer = setTimeout(()=> showArtPop(id, x, y), ART_POP_DELAY_MS);
}
for(const host of [$("tracks"), $("list")]){
  host.addEventListener("pointermove", e=>{
    if(drag){ hideArtPop(); return; }               /* never over a drag */
    const n = e.target.closest(".trk, .row");
    if(!n){ hideArtPop(); return; }
    armArtPop(n, e.clientX, e.clientY);
  });
  host.addEventListener("pointerleave", hideArtPop);
  host.addEventListener("pointerdown", hideArtPop);
  host.addEventListener("focusin", e=>{
    const n = e.target.closest(".trk, .row"); if(!n) return;
    const r = n.getBoundingClientRect(); armArtPop(n, r.left + Math.min(r.width, 40), r.bottom);
  });
  host.addEventListener("focusout", hideArtPop);
}
addEventListener("scroll", hideArtPop, true);
$("list").addEventListener("click", async e=>{
  const r = e.target.closest(".row"); if(!r) return;
  if(r.classList.contains("rm")){ selectTrack(+r.dataset.i); return; }
  /* an add candidate becomes an insertion proposal, reviewed in the drawer */
  openDrawer(true);
  apply(await window.pywebview.api.insert_candidate(r.dataset.id, null));
});

/* Freshness: the set on screen is a reading of master.db + -wal at one moment.
   Say when, and whether rekordbox is open. */
let FRESH = {state: "fresh", rb: null};   /* fresh | stale */
/* Lives in the settings sheet (2026-09-16 review): the panel follows rekordbox
   by itself, so a "reload" button on the main view read as a contradiction.
   The one case that needs the DJ -- a change held back because this app has
   unapplied trials -- lights the settings button instead. */
function renderFresh(){
  $("settings").classList.toggle("hasnew", FRESH.state === "stale");
  const txt = $("freshTxt"), b = $("rescan");
  if(!txt || !b) return;                      /* the sheet is not open */
  const at = LOADED_AT ? LOADED_AT.toLocaleTimeString("ja-JP", {hour:"2-digit", minute:"2-digit"}) : "—";
  const rb = FRESH.rb != null ? FRESH.rb : (BOOT && BOOT.rekordbox_running);
  let msg;
  if(FRESH.state === "stale"){
    msg = `rekordbox の変更を検出しました。この画面で試した操作を保つため、まだ反映していません`;
    b.className = "btn primary";
  } else {
    msg = `${at} 時点の rekordbox ライブラリを表示しています` + (rb ? "（rekordbox 起動中）" : "");
    b.className = "btn";
  }
  b.textContent = "今の rekordbox を読み直す";
  txt.innerHTML = `<span class="dot${FRESH.state !== "fresh" || rb ? " rb" : ""}"></span>${msg}`;
}

/* Automatic refresh (§5-1): poll master.db / -wal, and check on every window
   focus, since the DJ comes back here right after editing in rekordbox. While
   rekordbox is open every edit lands in the -wal (it never checkpoints until
   exit), and the decrypter replays it, so both files count as readable change.
   A change reloads by itself when nothing in this app would be lost;
   otherwise it lights the button and waits. */
let LIB_SIG = null, pollTimer = null, polling = false;
async function pollLibrary(){
  if(polling || !ST || !$("curtain").hidden) return;
  polling = true;
  try {
    const c = await window.pywebview.api.library_changed();
    if(!c || !c.ready) return;
    FRESH.rb = c.rekordbox_running;
    if(!LIB_SIG){ LIB_SIG = c; renderFresh(); return; }
    if(c.db !== LIB_SIG.db || c.wal !== LIB_SIG.wal){
      const busy = drag || knobDrag || !$("modal").hidden || (ST.agent && ST.agent.pending);
      if(!c.edited && !busy){
        LIB_SIG = c;
        await refreshFromRekordbox("rekordbox の編集を反映しました");
        return;
      }
      if(FRESH.state !== "stale")
        toast("rekordbox の変更を検出しました。設定から読み直せます（今の試行は保たれます）");
      FRESH.state = "stale";
    }
    LIB_SIG = c;
    renderFresh();
  } catch(e){ /* a failed poll is not news */ }
  finally { polling = false; }
}
async function refreshFromRekordbox(note){
  $("curtain").hidden = false; $("cTitle").textContent = "rekordbox の編集を読み直しています…";
  $("cMsg").textContent = "master.db と -wal を読み直してセットを組み直します。";
  const s = await window.pywebview.api.rescan();
  LOADED_AT = new Date(); FRESH.state = "fresh"; LIB_SIG = null;
  apply(s, true);
  if(note && s && s.tracks) toast(note);
}
function startPolling(){
  clearInterval(pollTimer);
  pollTimer = setInterval(pollLibrary, 5000);
  window.addEventListener("focus", pollLibrary);
  document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) pollLibrary(); });
}

/* ---------------- detail view ---------------- */
/* the waterfall: what trimming can actually buy, against the gap */
function renderReality(){
  const tgt = ST.target_s || 0, tot = ST.total_s;
  const over = Math.max(0, tot - tgt);
  const r = $("reality"), trims = ST.trims || [], sum = ST.trim_total_s || 0;
  /* within the target there is nothing to trim, so the row disappears (review) */
  r.parentElement.hidden = over <= 0;
  if(over <= 0){ r.innerHTML = ""; return; }
  r.className = "reality crit";
  const pct = sum ? (sum/over*100) : 0;
  const scale = v => Math.max(2, v/over*100);
  r.innerHTML = `<h3>削り代だけでは届きません</h3>
    <p>テンポ調整で稼げるのは全曲あわせて <b>${fmt(sum)}</b>。超過 <b>${fmt(over)}</b> の
       <b>${pct.toFixed(1)}%</b> です。曲を外す必要があります。</p>
    <div class="wf">` +
    trims.slice(0,8).map(t=>`<div class="wf-row">
        <span class="wf-name" title="${esc(t.title)}">${esc(t.title)}</span>
        <span class="wf-bar" style="width:${scale(t.gain_s)}%"></span>
        <span>−${fmt(t.gain_s)}</span></div>`).join("") +
    `<div class="wf-row wf-sum"><span class="wf-name" style="color:var(--ink-2)">削り代の合計</span>
       <span class="wf-bar" style="width:${scale(sum)}%"></span>
       <span style="color:var(--caution)">−${fmt(sum)}</span></div>
     <div class="wf-row"><span class="wf-name" style="color:var(--ink-2)">超過</span>
       <span class="wf-bar gap" style="width:100%"></span>
       <span style="color:var(--critical-ink)">${fmt(over)}</span></div></div>`;
}

function renderLanes(){
  if(mode === "section") $("canvas").style.width = "100%";      /* measure after this */
  const k = pps(), W = mode === "section" ? laneWidth() : Math.max(ST.total_s*k, 800);
  if(mode !== "section") $("canvas").style.width = W + "px";
  $("density").textContent = mode === "section" ? "全体を横幅に収めて表示（曲線は近似）" : `1分 = ${DENSITY[mode]}px`;
  $("minimap").hidden = mode === "section";      /* the whole set is already in view */

  /* ruler marks at the coarsest step that leaves ≥48px between labels */
  const step = [60, 120, 300, 600, 900, 1800, 3600].find(s => s*k >= 48) || 3600;
  let r = "";
  for(let t = 0; t <= ST.total_s; t += step){
    if(mode === "section" && t*k + 44 > W) break;   /* a label past the right edge would force a scrollbar */
    r += `<div class="rmark" style="left:${(t*k).toFixed(1)}px">${fmt(t)}</div>`;
  }
  $("ruler").innerHTML = r;
  $("scroll").style.overflowX = mode === "section" ? "hidden" : "";

  let h = "";
  for(const t of ST.tracks){
    const x = t.start_s*k, w = Math.max((t.end_s - t.start_s)*k, 1);
    /* one grey per track, alternating; no analysis keeps its hatch */
    const inner = t.phrases.length ? "" : `<div class="none" title="フレーズ解析なし"></div>`;
    h += `<div class="trk${t.i % 2 ? " alt" : ""}" tabindex="0" data-i="${t.i}" data-sel="${t.i === ST.selected ? 1 : 0}"
            style="left:${x.toFixed(1)}px;width:${w.toFixed(1)}px"
            title="${esc(t.title)}
${fmt(t.start_s)} → ${fmt(t.end_s)}  再生 ${fmt(t.play_s)}
${t.bpm} BPM${t.set_tempo !== t.bpm ? " → " + t.set_tempo : ""} · ${esc(plabel(t.preset))}${t.locks.length ? " · ロック: " + esc(t.locks.join(",")) : ""}
${t.phrases.length ? "ダブルクリックでフレーズ構成" : "フレーズ解析なし"}">${inner}` +
         /* "No. title" on every block at both densities (2026-09-17). The label
            ellipsises to the block's width; a block too narrow for even one
            glyph plus the ellipsis gets none, so a row of lone "…" never appears */
         (w >= LABEL_MIN_PX ? `<div class="trk-t">${t.i+1}. ${esc(t.title)}</div>` : "") +
         `</div>`;
    if(t.milestone_s != null)
      h += `<div class="mile" style="left:${x.toFixed(1)}px" title="マイルストーン ${fmt(t.milestone_s)}"></div>`;
  }
  if(ST.target_s) h += `<div class="tline" style="left:${(ST.target_s*k).toFixed(1)}px"></div>`;

  /* S4-3: what the ticked proposal would do, drawn over the set, nothing applied */
  const g = (ST.agent || {}).ghost;
  if(g && g.tracks){
    for(const t of g.tracks){
      const gx = t.start_s*k, gw = Math.max((t.end_s - t.start_s)*k, 1);
      h += `<div class="ghost" style="left:${gx.toFixed(1)}px;width:${gw.toFixed(1)}px"
              title="提案後: ${esc(t.title)}"></div>`;
    }
  }
  $("tracks").innerHTML = h;

  renderEnergy(W, k);
  renderSections(W, k);
}

function renderEnergy(W, k){
  /* the lane's height comes from the flex column, not a constant, so the curve
     fills whatever the window leaves for it */
  const H = Math.max(92, Math.round($("energy").clientHeight) || 150);
  const top = 8, base = H - 6;
  const ey = v => (base - v*(base - top)).toFixed(1);
  const ex = s => (s*k).toFixed(1);

  /* measured: one polyline, broken wherever analysis is missing */
  let paths = "", run = [];
  const flush = () => {
    if(run.length > 1){
      paths += `<path d="M${run[0][0]},${base}L` + run.map(p=>p[0]+","+p[1]).join("L") +
               `L${run[run.length-1][0]},${base}Z" fill="var(--measure)" fill-opacity=".30"
                 stroke="var(--measure)" stroke-width="1.5" stroke-linejoin="round"></path>`;
    }
    run = [];
  };
  for(const p of energyPoints(k)){
    if(!p.known){ flush(); continue; }
    run.push([ex(p.t), ey(p.e)]);
  }
  flush();

  /* unknown stretches get a hatch — never an interpolated value */
  let holes = "";
  for(const t of ST.tracks){
    if(t.phrases.length) continue;
    holes += `<rect x="${ex(t.start_s)}" y="${top}" width="${((t.end_s-t.start_s)*k).toFixed(1)}"
               height="${base-top}" fill="url(#hatch)"></rect>`;
  }

  /* deviation bands */
  let bands = "";
  for(const d of (ST.deviation || [])){
    const col = d.kind === "over" ? "var(--critical)" : "var(--caution)";
    bands += `<rect x="${ex(d.start_s)}" y="${top}" width="${((d.end_s-d.start_s)*k).toFixed(1)}"
               height="${base-top}" fill="${col}" fill-opacity=".13"></rect>`;
  }

  /* target curve, over set length */
  let curve = "", knobs = "";
  if(ST.curve && ST.curve.length){
    curve = `<path d="` + ST.curve.map(([pos,v],i)=>
      `${i?"L":"M"}${ex(pos*ST.total_s)},${ey(v)}`).join("") +
      `" fill="none" stroke="var(--target)" stroke-width="2" stroke-dasharray="5 4"></path>`;
    knobs = ST.curve.map(([pos,v],i)=>
      `<circle class="knob" data-ci="${i}" cx="${ex(pos*ST.total_s)}" cy="${ey(v)}" r="5.5"
        fill="var(--target)" stroke="var(--surface)" stroke-width="2"></circle>`).join("");
  }

  $("energy").innerHTML =
    `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img"
       aria-label="実測エネルギーとターゲットカーブ">
      <defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"
        patternTransform="rotate(45)">
        <rect width="8" height="8" fill="#20262d"></rect>
        <rect width="4" height="8" fill="#2a3038"></rect></pattern></defs>
      ${bands}${holes}
      <line x1="0" y1="${base}" x2="${W}" y2="${base}" stroke="var(--line)" stroke-width="1"></line>
      ${paths}${curve}${knobs}
    </svg>`;
  ENERGY_GEOM = {top, base, W};
}

/* At the fit-to-width density a 137-minute set is ~3px per minute, and every
   sample drawn is noise. The measured curve is averaged into 3px buckets so the
   hills and valleys stay readable in a tall, narrow panel. Gaps stay gaps: a
   bucket that is mostly "no analysis" breaks the line (never interpolated). */
function energyPoints(k){
  const pts = ST.energy || [];
  if(mode !== "section" || pts.length < 4) return pts;
  const bucketS = 3 / k, n = Math.max(1, Math.ceil(ST.total_s / bucketS));
  const sum = new Float64Array(n), cnt = new Uint32Array(n), unk = new Uint32Array(n);
  for(const p of pts){
    const b = Math.min(n - 1, Math.max(0, Math.floor(p.t / bucketS)));
    if(p.known){ sum[b] += p.e; cnt[b]++; } else unk[b]++;
  }
  const out = [];
  for(let b = 0; b < n; b++){
    if(!cnt[b] && !unk[b]) continue;
    const t = (b + .5) * bucketS;
    if(cnt[b] < unk[b]) out.push({t, e: 0, known: false});
    else out.push({t, e: sum[b] / cnt[b], known: true});
  }
  return out;
}

/* ---- target curve: drag a control point, double-click to add, right-click to remove ---- */
let ENERGY_GEOM = {top: 8, base: 144, W: 1};
let knobDrag = null;

function curveAt(clientX, clientY){
  const svg = $("energy").querySelector("svg");
  if(!svg) return null;
  const r = svg.getBoundingClientRect();
  const {top, base} = ENERGY_GEOM;
  const pos = (clientX - r.left) / Math.max(r.width, 1);
  const energy = (base - (clientY - r.top)) / Math.max(base - top, 1);
  return {pos: Math.min(1, Math.max(0, pos)), energy: Math.min(1, Math.max(0, energy))};
}
$("energy").addEventListener("pointerdown", e=>{
  const k = e.target.closest(".knob"); if(!k) return;
  knobDrag = {i: +k.dataset.ci, node: k};
  k.setPointerCapture?.(e.pointerId);
});
window.addEventListener("pointermove", e=>{
  if(!knobDrag) return;
  const c = curveAt(e.clientX, e.clientY); if(!c) return;
  const {top, base, W} = ENERGY_GEOM;
  knobDrag.at = c;
  knobDrag.node.setAttribute("cx", (c.pos * W).toFixed(1));
  knobDrag.node.setAttribute("cy", (base - c.energy * (base - top)).toFixed(1));
});
window.addEventListener("pointerup", async ()=>{
  if(!knobDrag) return;
  const d = knobDrag; knobDrag = null;
  if(!d.at) return;
  apply(await window.pywebview.api.move_curve_point(d.i, d.at.pos, d.at.energy));
});
$("energy").addEventListener("dblclick", async e=>{
  if(!ST.curve || !ST.curve.length){ toast("先に目標カーブを選んでください"); return; }
  if(e.target.closest(".knob")) return;
  const c = curveAt(e.clientX, e.clientY); if(!c) return;
  apply(await window.pywebview.api.add_curve_point(c.pos, c.energy));
});
$("energy").addEventListener("contextmenu", async e=>{

  apply(await window.pywebview.api.remove_curve_point(+k.dataset.ci));
});

function renderSections(W, k){
  if(!ST.sections.length){ $("sections").innerHTML = ""; return; }
  $("sections").innerHTML = ST.sections.map(s=>{
    const x = s.start_s*k, w = Math.max((s.end_s - s.start_s)*k, 130);
    const has = s.target_s != null && s.target_s > 0;
    const ratio = has ? Math.min(s.actual_s/s.target_s, 1) : 1;
    const diff = has ? s.actual_s - s.target_s : null;
    return `<div class="sec" style="left:${x.toFixed(1)}px;width:${w.toFixed(1)}px">
      <div class="sec-n" title="${esc(s.name)}">${esc(s.name)}</div>
      <div class="sec-b"><div class="sec-f" style="width:${(ratio*100).toFixed(1)}%"></div>
        ${has?`<div class="sec-t" style="left:98%"></div>`:""}</div>
      <div class="sec-v">${s.tracks}曲 · ${fmt(s.actual_s)}` +
        (diff == null ? " · 目標なし"
          : ` · <span class="${diff>0?"o":"u"}">${diff>0?"+":"−"}${fmt(Math.abs(diff))}</span>`) +
      `</div></div>`;
  }).join("");
}

function renderMinimap(){
  const mm = $("minimap"), w = mm.clientWidth, k = w/Math.max(ST.total_s,1);
  let h = `<div class="mm-view" id="mmView"></div>`;
  let lane = "";
  for(const t of ST.tracks){
    lane += `<div style="position:absolute;top:0;height:14px;left:${(t.start_s*k).toFixed(1)}px;
              width:${Math.max((t.end_s-t.start_s)*k,.5).toFixed(1)}px;
              background:${t.phrases.length ? (t.i % 2 ? "#3a4350" : "#2a313a") : "#20262d"}"></div>`;
  }
  const H = 26, top = 14;
  let d = `M0,${top+H}`;
  for(const p of ST.energy) if(p.known) d += `L${(p.t*k).toFixed(1)},${(top+H-2-p.e*(H-4)).toFixed(1)}`;
  d += `L${w},${top+H}Z`;
  mm.innerHTML = lane +
    `<svg width="${w}" height="${top+H}" style="position:absolute;left:0;top:0">
       <path d="${d}" fill="var(--measure)" fill-opacity=".3" stroke="var(--measure)"
         stroke-width="1"></path></svg>` +
    (ST.target_s ? `<div style="position:absolute;top:0;bottom:0;width:2px;background:var(--target);
       left:${(ST.target_s*k).toFixed(1)}px"></div>` : "") + h;
}

/* click to select, drag to reorder — one pointer gesture, 5px decides which */
let drag = null;
function selectTrack(i){
  ST.selected = i;
  document.querySelectorAll(".trk,.row").forEach(x => x.dataset.sel = (+x.dataset.i === i) ? 1 : 0);
  renderSelected();
  window.pywebview.api.select(i);
}
function dropIndexAt(clientX){
  /* snap only to boundaries that are actually on screen (Phase 1 research) */
  const host = $("tracks").getBoundingClientRect();
  const x = clientX - host.left, k = pps();
  let best = 0;
  for(const t of ST.tracks){
    if(t.start_s*k < x) best = t.i; else break;
  }
  const t = ST.tracks[best];
  if(t && x > (t.start_s + (t.end_s - t.start_s)/2)*k) best += 1;
  return Math.max(0, Math.min(ST.tracks.length - 1, best));
}
const EDGE_PX = 7;                      /* grab zone for trimming the play range */

function edgeAt(node, clientX){
  const r = node.getBoundingClientRect();
  if(r.width < EDGE_PX * 3) return null;    /* a sliver at the fit density has no edges to grab */
  if(clientX - r.left <= EDGE_PX) return "in";
  if(r.right - clientX <= EDGE_PX) return "out";
  return null;
}
$("tracks").addEventListener("pointermove", e=>{
  if(drag) return;                      /* mid-gesture: leave the cursor alone */
  const n = e.target.closest(".trk");
  $("tracks").style.cursor = (n && edgeAt(n, e.clientX)) ? "ew-resize" : "";
});
$("tracks").addEventListener("pointerdown", e=>{
  const n = e.target.closest(".trk"); if(!n) return;
  const t = ST.tracks.find(x => x.i === +n.dataset.i);
  const edge = edgeAt(n, e.clientX);
  drag = {i: +n.dataset.i, x0: e.clientX, node: n, moved: false,
          edge, track: t,
          w0: n.getBoundingClientRect().width,
          left0: parseFloat(n.style.left) || 0};
  n.setPointerCapture?.(e.pointerId);
});
$("tracks").addEventListener("pointermove", e=>{
  if(!drag) return;
  if(!drag.moved && Math.abs(e.clientX - drag.x0) < 5) return;
  if(!drag.moved){
    drag.moved = true;
    if(!drag.edge){
      drag.node.classList.add("dragging");
      const line = document.createElement("div");
      line.className = "dropline"; line.id = "dropline";
      $("tracks").appendChild(line);
    }
  }
  const dx = e.clientX - drag.x0;

  if(drag.edge){                        /* trimming: the block follows the edge */
    if(drag.edge === "in"){
      const w = Math.max(6, drag.w0 - dx);
      drag.node.style.left = (drag.left0 + dx) + "px";
      drag.node.style.width = w + "px";
    } else {
      drag.node.style.width = Math.max(6, drag.w0 + dx) + "px";
    }
    drag.dx = dx;
    return;
  }

  const to = dropIndexAt(e.clientX);
  const target = ST.tracks[to];
  const line = $("dropline");
  if(line && target) line.style.left = ((to > drag.i ? target.end_s : target.start_s) * pps()) + "px";
  drag.to = to;
});
$("tracks").addEventListener("pointerup", async e=>{
  if(!drag) return;
  const d = drag; drag = null;
  $("dropline")?.remove();
  d.node.classList.remove("dragging");
  if(!d.moved){ selectTrack(d.i); return; }

  if(d.edge){
    /* set-time pixels -> source-time ms: undo the tempo scaling the engine applied */
    const t = d.track;
    const scale = (t.bpm && t.set_tempo) ? (t.set_tempo / t.bpm) : 1;
    const deltaMs = (d.dx / pps()) * 1000 * scale;
    const outMs = t.play_out_ms != null ? t.play_out_ms
                : Math.round((t.source_len_s || 0) * 1000);
    const inMs = d.edge === "in" ? Math.round(t.play_in_ms + deltaMs) : t.play_in_ms;
    const newOut = d.edge === "out" ? Math.round(outMs + deltaMs) : outMs;
    ST.selected = d.i;
    apply(await window.pywebview.api.set_range(d.i, inMs, newOut));
    return;
  }

  if(d.to == null || d.to === d.i) return;
  ST.selected = d.to;
  apply(await window.pywebview.api.move(d.i, d.to));
});
$("tracks").addEventListener("pointercancel", ()=>{
  if(!drag) return;
  $("dropline")?.remove();
  drag.node.classList.remove("dragging");
  const wasEdge = drag.edge;
  drag = null;
  if(wasEdge) renderLanes();            /* put the half-dragged block back */
});

/* ---- phrase sheet: the rekordbox phrase colours, one track at a time ---- */
function showPhrases(i){
  const t = ST.tracks.find(x => x.i === i); if(!t) return;
  const span = Math.max(t.end_s - t.start_s, 0.001);
  let strip, body;
  if(t.phrases.length){
    strip = t.phrases.map(p => `<div class="ph" title="${esc(p.label)} ${fmt(p.start_s)}–${fmt(p.end_s)}"
        style="left:${((p.start_s - t.start_s)/span*100).toFixed(2)}%;width:${((p.end_s - p.start_s)/span*100).toFixed(2)}%;
        background:${PH_COLOR[p.group] || "var(--ph-verse)"}"></div>`).join("");
    body = `<div class="ph-list">` + t.phrases.map(p =>
      `<span class="lg"><i class="sw" style="background:${PH_COLOR[p.group] || "var(--ph-verse)"}"></i>${esc(p.label)}<b>${fmt(p.start_s)}–${fmt(p.end_s)}</b></span>`).join("") + `</div>
      <p class="hint">色は rekordbox のフレーズ色と同じ意味です（Intro 橙 / Up 紫 / Chorus 緑 / Down 茶 / Outro 青 / Verse 灰）</p>`;
  } else {
    strip = `<div class="none"></div>`;
    body = `<p>この曲にはフレーズ解析がありません。rekordbox の環境設定 &gt; 解析 で「フレーズ」をオンにして再解析すると出ます。</p>`;
  }
  modal(`${i + 1}. ${t.title}`,
    `<p class="hint">${fmt(t.start_s)} → ${fmt(t.end_s)} · 再生 ${fmt(t.play_s)} · ${t.bpm} BPM · ${esc(plabel(t.preset))}</p>
     <div class="phrase-strip">${strip}</div>${body}`,
    [{label: "閉じる"}]);
}

  let running = ST.set_bpm;
  for(const c of (ST.bpm_changes || [])) if(c.i < idx) running = c.bpm;
  return running;
}

const MODELS = [["sonnet", "Sonnet（標準・速い）"], ["opus", "Opus（高度・遅い）"]];
function connHtml(s){
  const c = s.cli || {};
  const seat = c.subscription === "enterprise" ? "企業アカウント" : (c.subscription || "ログイン済み");
  if(s.mode === "cli")
    return `<span class="dot on"></span><span>Claude Code ${esc(c.version || "")} に接続しています（${esc(c.org || seat)}）</span>`;
  if(c.found && !c.logged_in)

            <button class="btn" id="fLogin" title="Claude Code のログイン画面をコンソールで開きます。会社のアカウントでログインしてください">ログイン</button>`;

    return `<span class="dot"></span><span>Claude Code が見つかりません。Claude Desktop を入れてログインすると、キーなしで使えます</span>`;
  if(s.mode === "api")
    return `<span class="dot on"></span><span>API キーで接続しています（${esc(s.api_model)}）</span>`;

function modelOptions(s){
  const cur = s.model || "sonnet";

  return opts.map(([v, l]) => `<option value="${esc(v)}"${v === cur ? " selected" : ""}>${esc(l)}</option>`).join("");

                          : r.mode === "api" ? `API キーで動きます（${r.api_model}）`
                          : "Claude に接続していません。アドバイザで動作します"));
        apply(await window.pywebview.api.state());
     }}]);
  renderFresh();
  $("rescan").addEventListener("click", ()=>{ closeModal(); refreshFromRekordbox(null); });
  $("fRecheck").addEventListener("click", ()=>{ closeModal(); openSettings(true); });
  const lg = $("fLogin");
  if(lg) lg.addEventListener("click", async ()=>{
    const r = await window.pywebview.api.claude_login();
    toast(r.ok ? "コンソールでログインを完了したら「再確認」を押してください" : r.error);
  });
}
$("settings").addEventListener("click", ()=> openSettings(false));

document.querySelectorAll("[data-zoom]").forEach(b=>{
  b.addEventListener("click", ()=>{
    mode = b.dataset.zoom;
    document.querySelectorAll("[data-zoom]").forEach(o=>
      o.setAttribute("aria-pressed", String(o === b)));
    renderLanes(); syncView();
  });
});

let dragging = false;
function jump(clientX){
  const r = $("minimap").getBoundingClientRect();
  const f = Math.min(Math.max((clientX - r.left)/r.width, 0), 1);
  const sc = $("scroll");
  sc.scrollLeft = f*$("canvas").clientWidth - sc.clientWidth/2;
}
$("minimap").addEventListener("pointerdown", e=>{ dragging = true; jump(e.clientX); });
window.addEventListener("pointermove", e=>{ if(dragging) jump(e.clientX); });
window.addEventListener("pointerup", ()=>{ dragging = false; });

$("pl").addEventListener("change", reload);
$("preset").addEventListener("change", ()=>{ $("cap32Lbl").hidden = !capApplies(); reload(); });
$("cap32").addEventListener("change", reload);
$("target").addEventListener("change", async ()=>
  apply(await window.pywebview.api.set_target(targetSeconds())));
$("curve").addEventListener("change", async ()=>
  apply(await window.pywebview.api.set_curve($("curve").value)));
$("undo").addEventListener("click", async ()=> apply(await window.pywebview.api.undo()));
$("redo").addEventListener("click", async ()=> apply(await window.pywebview.api.redo()));
$("cRetry").addEventListener("click", ()=>{ $("cRetry").hidden = true; boot(); });

/* ---- agent drawer ---- */
function openDrawer(on){
  $("drawer").hidden = !on;
  if(on){
    seenMsgs = ((ST.agent || {}).chat || []).length;
    $("agentBtn").classList.remove("hasnew");
    const c = $("chat"); c.scrollTop = c.scrollHeight;
    setTimeout(()=> $("askText").focus(), 30);
  }
}
$("agentBtn").addEventListener("click", ()=> openDrawer($("drawer").hidden));
$("dwClose").addEventListener("click", ()=> openDrawer(false));
window.addEventListener("keydown", e=>{
  if(e.key === "Escape" && $("modal").hidden && !$("drawer").hidden) openDrawer(false);
});

async function send(){
  const t = $("askText").value.trim();
  if(!t) return;
  $("askText").value = "";
  $("askSend").disabled = true;
  try { apply(await window.pywebview.api.ask(t)); }
  finally { $("askSend").disabled = false; $("askText").focus(); }
}
$("askSend").addEventListener("click", send);
$("askText").addEventListener("keydown", e=>{ if(e.key === "Enter") send(); });
$("askHints").addEventListener("click", e=>{
  const a = e.target.closest(".hintq"); if(!a) return;
  e.preventDefault();
  $("askText").value = a.dataset.q;
  send();
});
$("level").addEventListener("change", async ()=>
  apply(await window.pywebview.api.set_level($("level").value)));
$("cands").addEventListener("click", async e=>{
  const b = e.target.closest(".cand"); if(!b) return;
  apply(await window.pywebview.api.insert_candidate(b.dataset.id, null));
});
$("pending").addEventListener("change", async e=>{
  const c = e.target.closest(".op"); if(!c) return;
  apply(await window.pywebview.api.set_item_approved(+c.dataset.i, c.checked));
});
$("pending").addEventListener("click", async e=>{
  if(e.target.id === "applyPending") apply(await window.pywebview.api.apply_pending());
  if(e.target.id === "rejectPending") apply(await window.pywebview.api.reject_pending());
});

window.addEventListener("pywebviewready", boot);
</script>
</body></html>
