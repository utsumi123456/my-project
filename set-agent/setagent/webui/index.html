<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<title>Set Agent</title>
<style>
/* avoid-ai-design-ignore-file: SD2 -- teenage engineering catalogue palette (five neutrals); red/amber are
   state colours (over / under), blue is only the text-link colour, and the phrase hues are rekordbox 7's.
   ui-polish-ignore-file: UX6 -- the nowrap labels are ruler marks and short fixed-width readouts. */
/* Visual language (2026-10-05): teenage engineering's catalogue -- a near-white
   canvas, white islands for the things you touch, 1px hairline rules instead of
   fills, one Carbon band (the predicted length) as the display case. Zero radius,
   zero shadows, thin type. Colour is rationed to state: amber = under,
   red = over. Measured data and markers are black, like a technical drawing. */
:root{
  color-scheme:light;
  --page:#f6f8f7; --surface:#f6f8f7; --raised:#ffffff; --sunken:#e5e5e5;
  --line:#b2b2b2; --line-soft:#e5e5e5; --rule:#000000;
  /* ink-3 is darker than TE's graphite so 11px helper text stays AA (4.8:1) */
  --ink:#000000; --ink-2:#3c3c3c; --ink-3:#6e6e6e;
  --carbon:#0f0e12; --on-carbon:#f6f8f7; --on-carbon-2:#b2b2b2; --carbon-2:#26252b;
  --carbon-rule:var(--carbon); --primary-hover:#26252b;
  --r:0;
  /* track blocks: two greys alternating so blocks can be counted without a key */
  --trk-a:#e5e5e5; --trk-b:#d2d2d2;

  /* phrase palette — rekordbox 7 hues (phrase sheet only) */
  --ph-intro:#c83201; --ph-up:#8c32ff; --ph-chorus:#1fb013;
  --ph-down:#955b00; --ph-outro:#2f84cf; --ph-verse:#5a6270;

  --target:#000000; --measure:#000000;
  --critical:#d0341a; --critical-ink:#b52d12;   /* over: fill / text on canvas */
  --caution:#f5a800;  --caution-ink:#8a5a00;    /* under: the amber triangle */
  --ok:#000000; --link:#0071bb;
  --s1:4px; --s2:8px; --s3:11px; --s4:15px; --s5:22px; --s6:33px;
  /* te-20 substitute: Segoe UI Variable (Windows 11) + Yu Gothic UI Light for
     kana/kanji, both shipped with the OS, so nothing is bundled. macOS: Latin
     in Helvetica Neue (Light), kana/kanji in Hiragino Sans -- Hiragino first
     would set the Latin too and read as the system default. */
  --sans:"Segoe UI Variable Text","Segoe UI","Helvetica Neue","Yu Gothic UI","Hiragino Sans",Arial,sans-serif;
  --display:"Segoe UI Variable Display","Segoe UI Light","Segoe UI","Helvetica Neue","Yu Gothic UI","Hiragino Sans",Arial,sans-serif;
  --mono:var(--sans);
  --ghost-fill:rgba(0,0,0,.06); --veil:rgba(0,0,0,.05);
}
/* Dark (2026-10-09, reworked after two reviews): the same catalogue turned
   over, with nothing but its own neutrals. Carbon becomes the canvas, the
   islands go black, hairlines go light. The display case stays dark (an
   inverted white band was rejected: the page no longer read as dark); it is
   told apart as the one window on the page by going a step deeper, to pure
   black, framed above and below by a light 1px rule. No new hues, no
   gradient, no shadow. */
:root[data-theme="dark"]{
  color-scheme:dark;
  --page:#0f0e12; --surface:#0f0e12; --raised:#000000; --sunken:#26252b;
  --line:#6e6e6e; --line-soft:#26252b; --rule:#f6f8f7;
  --ink:#f6f8f7; --ink-2:#e5e5e5; --ink-3:#b2b2b2;
  --carbon:#000000; --on-carbon:#f6f8f7; --on-carbon-2:#b2b2b2; --carbon-2:#26252b;
  --carbon-rule:#f6f8f7; --primary-hover:#e5e5e5;
  --trk-a:#26252b; --trk-b:#3c3c3c;
  --target:#f6f8f7; --measure:#f6f8f7; --ok:#f6f8f7; --link:#3a9ad9;
  --critical-ink:#f0533a; --caution-ink:#f5a800;
  --ghost-fill:rgba(246,248,247,.08); --veil:rgba(246,248,247,.06);
}
*{box-sizing:border-box}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:0;border:2px solid var(--page)}
::-webkit-scrollbar-thumb:hover{background:var(--ink-3)}
::-webkit-scrollbar-track{background:transparent}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--sans);
  font-size:13px;font-weight:300;line-height:1.5;overflow:hidden;font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased}
button,select,input{font-family:inherit;font-size:13px;font-weight:300}
b,strong{font-weight:400}

.app{display:flex;flex-direction:column;height:100vh}

/* ---- control bar ---- */
/* one row at the panel's 380px floor: tabs + four buttons, undo/redo as glyphs */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s2);flex:none;
  padding:var(--s3) var(--s4);border-bottom:1px solid var(--rule);background:var(--page)}
.bar label{display:flex;align-items:center;gap:6px;color:var(--ink-3);font-size:12px}
.bar select,.bar input[type=text]{background:var(--raised);color:var(--ink);
  border:1px solid var(--line);border-radius:0;padding:5px 7px}
.bar input[type=text]{width:74px;text-align:center}
.btn{appearance:none;background:transparent;color:var(--ink);border:1px solid var(--rule);
  border-radius:0;padding:5px 11px;cursor:pointer}
.btn:hover{background:var(--ink);color:var(--page)}
.btn:focus-visible,.seg button:focus-visible,select:focus-visible,input:focus-visible,
.row:focus-visible,.trk:focus-visible,.reco:focus-visible,.cand:focus-visible,.hintq:focus-visible,
.knob:focus-visible{outline:2px solid var(--target);outline-offset:2px}
select:focus,input:focus{outline:none}
select:focus-visible,input:focus-visible{outline:1px solid var(--target);outline-offset:0;border-color:var(--target)}
.btn.primary{color:var(--page);background:var(--ink);border-color:var(--ink)}
.btn.primary:hover{background:var(--primary-hover);border-color:var(--primary-hover)}
.btn.danger{color:#fff;background:var(--critical);border-color:var(--critical)}
.btn.danger:hover{background:var(--critical-ink)}
.btn:disabled{color:var(--line);border-color:var(--line);background:transparent;cursor:default}
.btn.hasnew{position:relative}
/* ui-polish-ignore: UX2 -- unread indicator on a 30px button, not a target */
.btn.hasnew::after{content:"";position:absolute;top:-4px;right:-4px;width:7px;height:7px;
  background:var(--caution)}
.spacer{margin-left:auto}

/* ---- hero (main view) ---- */
.eyebrow{font-size:12px;font-weight:400;color:var(--ink-3);margin:0 0 var(--s2)}
.gap-row{display:flex;align-items:baseline;gap:var(--s4);flex-wrap:wrap}
.hero{font-family:var(--display);font-size:40px;font-weight:300;line-height:1.11;
  font-variant-numeric:tabular-nums}
.gap-sub{font-size:13px;color:var(--ink-2)}
.gap-sub b{color:var(--ink);font-weight:400}
.bullet-track{position:relative;height:16px;background:var(--sunken);margin-top:var(--s3);
  overflow:visible}
.bullet-fill{position:absolute;left:0;top:0;bottom:0;background:var(--line)}
.bullet-over{position:absolute;top:0;bottom:0;background:var(--critical)}
.bullet-tick{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--target)}
.bullet-scale{display:flex;justify-content:space-between;margin-top:6px;
  font-size:11px;font-weight:400;color:var(--ink-3)}

.reality{background:var(--raised);border:1px solid var(--line-soft);border-radius:0;
  padding:var(--s3) var(--s4);overflow:auto;max-height:116px}
.reality.crit h3{color:var(--critical-ink)}
.reality h3{margin:0 0 6px;font-size:13px;font-weight:400}
.reality p{margin:0;font-size:12px;color:var(--ink-2)}
.wf{margin-top:var(--s2);display:flex;flex-direction:column;gap:3px}
.wf-row{display:grid;grid-template-columns:120px 1fr 54px;gap:var(--s2);align-items:center;
  font-size:11px;font-weight:400;color:var(--ink-2)}
.wf-name{color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wf-bar{height:6px;border-radius:0;min-width:2px;background:var(--caution)}
.wf-bar.gap{background:var(--critical)}
.wf-sum{border-top:1px solid var(--rule);margin-top:5px;padding-top:5px}

/* ---- transport ---- */
.transport{display:flex;align-items:center;gap:var(--s3);padding:var(--s2) var(--s4);flex:none;
  border-bottom:1px solid var(--line-soft);background:var(--page)}
.seg{display:flex;border:1px solid var(--rule);border-radius:0;overflow:hidden}
.seg button{background:transparent;color:var(--ink);border:0;border-right:1px solid var(--rule);
  padding:5px 12px;cursor:pointer}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--raised)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--page)}
.meta{font-size:11px;font-weight:400;color:var(--ink-3)}
.minimap{position:relative;height:40px;flex:1;background:var(--raised);
  border:1px solid var(--line-soft);border-radius:0;overflow:hidden;cursor:pointer}
.mm-view{position:absolute;top:-1px;bottom:-1px;border:1px solid var(--ink);
  background:var(--veil);border-radius:0;pointer-events:none}

/* ---- lanes ---- */
/* min-height:0 is what lets a flex child scroll instead of pushing the rest of
   the column off-screen; the floor keeps ENERGY and SECTIONS -- both Tier 1 --
   on screen at the shortest window we support. */
.scroll{flex:1 1 auto;min-height:400px;overflow:auto;background:var(--page)}
/* the lanes share the column: TRACKS and SECTIONS keep their size, ENERGY takes
   whatever height is left, so all three stay visible at any window height */
.canvas{position:relative;padding-bottom:var(--s2);display:flex;flex-direction:column;
  min-height:100%}
.lane-h{position:sticky;left:0;padding:var(--s3) var(--s4) 3px;font-size:12px;font-weight:400;
  color:var(--ink-3);width:max-content}
.ruler{position:relative;height:20px;border-bottom:1px solid var(--rule)}
.rmark{position:absolute;top:0;bottom:0;border-left:1px solid var(--line);padding-left:5px;
  font-size:11px;font-weight:400;color:var(--ink-3);line-height:20px;white-space:nowrap}
.ruler,.tracks,.sections,.lane-h{flex:none}
/* TRACKS is a ruler for the ENERGY lane below: which track is playing where,
   and how long each one runs. Two greys, alternating per track, so the eye can
   count blocks without a colour key. The phrase colours moved into the
   double-click sheet (2026-09-16 review). */
.tracks{position:relative;height:44px}
.trk{position:absolute;top:0;bottom:0;overflow:hidden;cursor:pointer;
  border-right:1px solid var(--page);background:var(--trk-a)}
.trk.alt{background:var(--trk-b)}
.trk:hover{background:var(--raised)}
.ph{position:absolute;top:0;bottom:0}
/* missing analysis: a hairline hatch, as on a technical drawing */
.trk .none,.phrase-strip .none{position:absolute;inset:0;
  background:repeating-linear-gradient(45deg,var(--line) 0 1px,transparent 1px 6px)}
.phrase-strip{position:relative;height:30px;border-radius:0;overflow:hidden;
  background:var(--sunken);margin:var(--s2) 0 var(--s3)}
.ph-list{display:flex;flex-wrap:wrap;gap:5px var(--s4);font-size:12px;color:var(--ink-2)}
.ph-list b{font-weight:400;color:var(--ink-3);margin-left:4px}
.trk-t{position:absolute;left:5px;right:4px;top:3px;font-size:11px;font-weight:400;color:var(--ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.trk-m{position:absolute;left:5px;bottom:3px;font-size:11px;font-weight:400;
  color:var(--ink-3);pointer-events:none}
.trk[data-sel="1"]{outline:2px solid var(--ink);outline-offset:-2px;z-index:3}
.energy{position:relative;flex:1 1 auto;min-height:92px}
/* the SVG is sized from the lane's height, so it must not also size the lane:
   in flow it fed its own height back, and once the window had been tall the lane
   never shrank -- the floor of the plot ended up below the scroll viewport */
.energy>svg{position:absolute;left:0;top:0}
.sections{position:relative;height:58px;border-top:1px solid var(--line-soft)}
.sec{position:absolute;top:0;bottom:0;border-left:1px solid var(--line);padding:4px 8px;
  overflow:hidden}
.sec-n{font-size:11px;font-weight:400;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec-b{position:relative;height:8px;background:var(--sunken);border-radius:0;margin-top:5px}
.sec-f{position:absolute;left:0;top:0;bottom:0;background:var(--line)}
.sec-t{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--target)}
.sec-v{font-size:11px;font-weight:400;margin-top:3px;color:var(--ink-2)}
.sec-v .o{color:var(--critical-ink)} .sec-v .u{color:var(--caution-ink)}
.mile{position:absolute;top:0;bottom:0;width:1px;background:var(--ink);z-index:4}
.mile::before{content:"";position:absolute;top:0;left:-5px;border:5.5px solid transparent;
  border-top-color:var(--ink);border-bottom:0}
.tline{position:absolute;top:0;bottom:0;border-left:1px dashed var(--target);z-index:4}
.knob{cursor:grab}
.knob:active{cursor:grabbing}

/* ---- footer ---- */
.foot{padding:var(--s3) var(--s4);border-top:1px solid var(--rule);background:var(--page);
  flex:none}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px var(--s3);margin-top:var(--s2);font-size:12px}
.kv dt{color:var(--ink-3)} .kv dd{margin:0;font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:6px var(--s4);padding:7px var(--s4);flex:none;
  border-top:1px solid var(--line-soft);background:var(--page);font-size:11px;font-weight:400;color:var(--ink-2)}
.lg{display:flex;align-items:center;gap:5px}
.sw{width:16px;height:9px;border-radius:0}
.sw.hatch{background:repeating-linear-gradient(45deg,var(--ink-3) 0 1px,transparent 1px 4px);
  outline:1px solid var(--line-soft)}

/* ---- inspector controls ---- */
.edit{display:flex;flex-direction:column;gap:6px;margin-top:var(--s3);padding-top:var(--s3);
  border-top:1px solid var(--line-soft)}
.edit label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-3)}
.edit select,.edit input[type=text]{background:var(--raised);color:var(--ink);
  border:1px solid var(--line);border-radius:0;padding:4px 6px;font-size:12px}
.edit input[type=text]{width:78px;text-align:center}
.locks{display:flex;gap:var(--s3)}
.locks label{color:var(--ink-2)}

/* ---- drag ---- */
.trk.dragging{opacity:.4}
.dropline{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--target);
  z-index:6;pointer-events:none;border-radius:0}

/* ---- agent drawer (Tier 2: it appears when asked for, over the timeline) ---- */
/* no shadow: the black edge rule is the only thing that lifts it */
.drawer{position:fixed;top:0;right:0;bottom:0;width:430px;max-width:92vw;z-index:22;
  background:var(--page);border-left:1px solid var(--rule);
  display:flex;flex-direction:column;gap:var(--s2);padding:var(--s3) var(--s4) var(--s4)}
.dw-head{display:flex;align-items:center;gap:var(--s3);flex:none;
  padding-bottom:var(--s3);border-bottom:1px solid var(--rule)}
.dw-head h2{margin:0;font-family:var(--display);font-size:19px;font-weight:300;line-height:1.15;color:var(--ink)}
.dw-head label{display:flex;align-items:center;gap:5px;margin-left:auto;font-size:12px;
  color:var(--ink-3)}
.dw-head select{background:var(--raised);color:var(--ink);border:1px solid var(--line);
  border-radius:0;padding:3px 6px;font-size:12px}
.dw-status{margin:0;font-size:12px;color:var(--ink-3);flex:none;
  border-bottom:1px solid var(--line-soft);padding-bottom:var(--s2)}
.chat{flex:1 1 auto;min-height:80px;overflow:auto;display:flex;flex-direction:column;gap:9px;
  padding-right:2px}
.msg{font-size:13px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.msg.you{color:var(--ink);background:var(--raised);border:1px solid var(--line-soft);
  padding:6px 10px;border-radius:0}
.msg.agent{color:var(--ink-2)}
.msg.meta{color:var(--ink-3);font-size:11px;font-weight:400}
.dw-ask{display:flex;gap:var(--s2);flex:none}
.dw-ask .btn{flex:none}
.dw-ask input{flex:1;min-width:0;background:var(--raised);color:var(--ink);border:1px solid var(--line);
  border-radius:0;padding:7px 9px;font-size:13px}
.cand{width:100%;display:grid;grid-template-columns:1fr 54px 44px 56px;gap:var(--s2);
  align-items:center;background:var(--raised);border:1px solid var(--line-soft);
  border-radius:0;padding:5px 8px;font-size:11px;font-weight:400;color:var(--ink-2);
  cursor:pointer;text-align:left}
.cand:hover{border-color:var(--ink);color:var(--ink)}
.cand span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cand-list{display:flex;flex-direction:column;gap:3px;margin-top:5px;max-height:130px;
  overflow:auto}
/* a long Change Set (a fit plan can remove 80+ tracks) scrolls inside its own
   box; its buttons stay pinned at the bottom so it can always be applied */
#pending{flex:0 1 auto;min-height:0;max-height:58vh;overflow:auto}
#pending .card .acts{position:sticky;bottom:calc(-1 * var(--s3));background:var(--raised);
  margin-bottom:calc(-1 * var(--s3));padding:var(--s2) 0 var(--s3);border-top:1px solid var(--line-soft)}
.card{background:var(--raised);border:1px solid var(--rule);
  border-radius:0;padding:var(--s3) var(--s4);margin-top:var(--s2)}
.card h3{margin:0 0 5px;font-size:13px;font-weight:400;color:var(--ink)}
.card .why{font-size:12px;color:var(--ink-2);margin:0 0 var(--s2)}
.card label{display:grid;grid-template-columns:16px 1fr;gap:7px;align-items:start;
  font-size:12px;color:var(--ink-2);margin-bottom:4px;cursor:pointer}
.card .diff{font-size:11px;font-weight:400;color:var(--ink-3);
  border-top:1px solid var(--line-soft);margin-top:var(--s2);padding-top:var(--s2);
  display:flex;flex-direction:column;gap:2px}
.card .acts{display:flex;gap:var(--s2);margin-top:var(--s3)}
.sec-title{font-size:12px;font-weight:400;color:var(--ink-3);margin:var(--s2) 0 0}
.plog{margin:0;font-size:11px;font-weight:400;color:var(--ink-3);flex:none}
/* the proposal drawn over the set before anything is applied (S4-3) */
.ghost{position:absolute;top:0;bottom:0;border:1px dashed var(--target);
  background:var(--ghost-fill);pointer-events:none;z-index:2}

/* ---- modal ---- */
.modal{position:fixed;inset:0;background:rgba(15,14,18,.55);display:grid;place-items:center;
  z-index:25;padding:var(--s4)}
.sheet{background:var(--page);border:1px solid var(--rule);border-radius:0;
  padding:var(--s5);max-width:720px;width:100%;max-height:82vh;overflow:auto}
.sheet h2{margin:0 0 var(--s4);font-family:var(--display);font-size:24px;font-weight:300;
  line-height:1.15;color:var(--ink)}
.sheet pre{background:var(--raised);border:1px solid var(--line-soft);border-radius:0;
  padding:var(--s3);font-family:var(--mono);font-size:12px;color:var(--ink-2);
  white-space:pre-wrap;margin:0}
.sheet p{color:var(--ink-2);font-size:13px;margin:0 0 var(--s3)}
.sheet .field{display:flex;flex-direction:column;gap:5px;margin-bottom:var(--s3)}
.sheet .field span{font-size:12px;color:var(--ink-3)}
.sheet .field input{background:var(--raised);color:var(--ink);border:1px solid var(--line);
  border-radius:0;padding:7px 9px;font-size:13px}
.mActions{display:flex;gap:var(--s2);justify-content:flex-end;margin-top:var(--s5);
  padding-top:var(--s4);border-top:1px solid var(--line-soft)}
.hint{font-size:12px;color:var(--ink-3);margin-top:var(--s2)}
.hintq{color:var(--link);text-decoration:none}
.hintq:hover,.hintq:focus-visible{text-decoration:underline}
.hint.warn{color:var(--caution-ink)}
.steps{margin:0;padding-left:1.3em;font-size:13px;color:var(--ink-2)}
.steps li{margin-bottom:5px}
.steps b{color:var(--ink)}

/* ---- boot / error ---- */
.curtain{position:fixed;inset:0;display:grid;place-items:center;background:var(--page);z-index:20}
.curtain .box{max-width:620px;padding:var(--s6);text-align:left}
.curtain h1{font-family:var(--display);font-size:26px;font-weight:300;line-height:1.11;margin:0 0 var(--s4)}
.curtain p{color:var(--ink-2);margin:0 0 var(--s3)}
.curtain pre{background:var(--raised);border:1px solid var(--line-soft);border-radius:0;
  padding:var(--s3);font-family:var(--mono);font-size:11px;color:var(--ink-2);
  white-space:pre-wrap;max-height:240px;overflow:auto}
/* toast: a strip of the Carbon band */
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--carbon);
  color:var(--on-carbon);border:1px solid var(--carbon-rule);border-radius:0;
  padding:10px 16px;font-size:13px;z-index:30;max-width:70vw}
/* Hover window for artwork (2026-09-17, user decision: not fixed in the lanes).
   Fixed-position so it can leave the scrolled lane; pointer-events off so it
   never steals the hover that opened it. The image runs to the edge -- the
   artwork is the card. */
.artpop{position:fixed;z-index:28;padding:0;background:var(--raised);border:1px solid var(--rule);
  border-radius:0;pointer-events:none}
.artpop img{display:block;width:120px;height:120px;border-radius:0;object-fit:cover;background:var(--sunken)}
/* Context menu (2026-09-17): the way to mark milestones and locks since the
   inspector's edit block left. Same surface as the popover. */
.ctx{position:fixed;z-index:29;min-width:200px;padding:0;background:var(--raised);border:1px solid var(--rule);
  border-radius:0;display:flex;flex-direction:column}
.ctx .h{font-size:11px;font-weight:400;color:var(--ink-3);padding:7px 10px;border-bottom:1px solid var(--line-soft);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}
.ctx button{background:none;border:0;color:var(--ink);font:inherit;font-size:12px;text-align:left;padding:7px 10px;border-radius:0;cursor:pointer}
.ctx button:hover,.ctx button:focus-visible{background:var(--ink);color:var(--page);outline:none}
.ctx button.on::before{content:"■ ";font-size:9px;vertical-align:1px}
/* ---- main view: the panel a DJ keeps beside rekordbox ----
   Only what they came to read: the set's predicted length, whether it fits, the
   way into recommendations, the conditions they set, and the running order.
   Everything analytical lives in the detail view. Must hold at ~380px wide. */
.main{flex:1 1 auto;min-height:0;overflow:auto;display:flex;flex-direction:column;
  gap:var(--s5);padding:var(--s4);background:var(--page)}
/* the predicted length is the one object on display: a Carbon band, full bleed,
   like the dark vitrine TE puts a product in */
.hero-block{margin:0 calc(-1 * var(--s4));padding:var(--s5) var(--s4) var(--s4);
  background:var(--carbon);color:var(--on-carbon);
  border-top:1px solid var(--carbon-rule);border-bottom:1px solid var(--carbon-rule)}
.hero-block .eyebrow{color:var(--on-carbon-2)}
.hero-block .hero{font-size:64px;line-height:1;letter-spacing:-.01em;color:var(--on-carbon)}
.hero-block .gap-sub{margin-top:var(--s3);display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap;
  color:var(--on-carbon-2)}
.hero-block .cnt{font-size:12px;font-weight:400;color:var(--on-carbon-2)}
.hero-block .bullet-track{background:var(--carbon-2);margin-top:var(--s4)}
.hero-block .bullet-fill{background:var(--on-carbon-2)}
.hero-block .bullet-tick{background:var(--on-carbon)}
.hero-block .bullet-scale{color:var(--on-carbon-2)}
.pill{display:inline-block;padding:1px 8px;border-radius:0;font-size:12px;
  font-weight:400;background:transparent;color:var(--ink-2);border:1px solid var(--line)}
.pill.over{color:#fff;background:var(--critical);border-color:var(--critical)}
.pill.under{color:#000;background:var(--caution);border-color:var(--caution)}
.pill.ok{color:var(--ink);background:transparent;border-color:var(--ink)}
.hero-block .pill.ok{color:var(--on-carbon);border-color:var(--on-carbon)}
.hero-block .pill.bpm{color:var(--on-carbon);background:transparent;border-color:var(--ink-3)}
.reco{display:grid;grid-template-columns:1fr auto;align-items:center;gap:var(--s3);text-align:left;
  background:var(--raised);border:1px solid var(--rule);
  border-radius:0;padding:var(--s3) var(--s4);color:var(--ink);cursor:pointer;font:inherit}
.reco:hover{background:var(--page)}
.reco.over h3{color:var(--critical-ink)} .reco.under h3{color:var(--caution-ink)}
.reco h3{margin:0;font-size:15px;font-weight:400;line-height:1.35}
.reco p{margin:3px 0 0;font-size:12px;line-height:1.5;color:var(--ink-2);max-width:60ch}
.reco .go{font-size:12px;color:var(--link);white-space:nowrap}
.reco:hover .go{text-decoration:underline}
/* margin-top = the row gap, so the name sits as far above the first row as the rows sit apart */
.cond-row{display:flex;flex-wrap:wrap;gap:var(--s2) var(--s4);margin-top:var(--s2)}
.cond-row label{display:flex;align-items:center;gap:6px;color:var(--ink-3);font-size:12px}
.cond-row select,.cond-row input[type=text]{background:var(--raised);color:var(--ink);
  border:1px solid var(--line);border-radius:0;padding:4px 7px}
.cond-row input[type=text]{width:70px;text-align:center}
.cond-row #setBpm{width:96px}
.cond-row select,.cond-row input[type=text]{height:28px}
button,input,select,textarea{border-radius:0}
input[type=text],input[type=password]{-webkit-appearance:none;appearance:none}
input[type=checkbox]{-webkit-appearance:none;appearance:none;flex:none;width:12px;height:12px;margin:0;
  border:1px solid var(--ink);background:var(--raised);cursor:pointer;vertical-align:middle}
input[type=checkbox]:checked{background:var(--ink);box-shadow:inset 0 0 0 2px var(--raised)}
select{-webkit-appearance:none;appearance:none;padding-right:24px!important;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),
                   linear-gradient(135deg,var(--ink) 50%,transparent 50%)!important;
  background-position:calc(100% - 13px) 52%,calc(100% - 9px) 52%!important;
  background-size:4px 4px!important;background-repeat:no-repeat!important}
.list-note{margin:0 0 var(--s3);font-size:12px;line-height:1.5;color:var(--ink-2);max-width:60ch}
/* BPM change points: "from track N on, the set runs at X" */
.bpmv{margin-top:var(--s3);border:1px solid var(--line-soft);border-radius:0;padding:var(--s2) var(--s3);
  display:flex;flex-direction:column;gap:6px;background:var(--raised)}
.bpmv .cp{display:grid;grid-template-columns:minmax(0,1fr) 64px auto;gap:var(--s2);align-items:center;font-size:12px}
.bpmv .cp .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2)}
.bpmv .cp b{font-weight:400;text-align:right}
.bpmv .cp .btn{padding:2px 8px;font-size:11px}
.bpmv .addcp{display:grid;grid-template-columns:minmax(0,1fr) auto 64px auto;gap:var(--s2);align-items:center}
.bpmv .addcp #cpFrom{font-variant-numeric:tabular-nums;white-space:nowrap}
#setBpm.auto{color:var(--ink-3)}
#setBpmAuto{margin-left:4px;font-size:11px}
.minimap[hidden]{display:none}
.bpmv select,.bpmv input[type=text]{background:var(--raised);color:var(--ink);border:1px solid var(--line);
  border-radius:0;padding:3px 6px;font-size:12px;min-width:0}
.bpmv input[type=text]{text-align:center}
.bpmv .none-yet{font-size:11px;color:var(--ink-3);margin:0}
.field select{background:var(--raised);color:var(--ink);border:1px solid var(--line);border-radius:0;
  padding:4px 6px;font-size:12px;height:28px}
/* status marks are squares: filled = on, amber = needs attention, hollow = off */
.conn{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap;margin:0 0 var(--s2);font-size:12px;line-height:1.5}
.conn .dot{display:inline-block;width:7px;height:7px;border-radius:0;background:transparent;
  border:1px solid var(--ink-3);flex:none}
.conn .dot.on{background:var(--ink);border-color:var(--ink)}
.conn .dot.warn{background:var(--caution);border-color:var(--caution)}
.conn .btn{padding:2px 8px;font-size:11px}
.pill.bpm{color:var(--ink);background:transparent}
.list{display:flex;flex-direction:column;border-top:1px solid var(--rule);border-radius:0;overflow:hidden}
.row,.list-h{display:grid;grid-template-columns:28px minmax(0,1fr) 56px 56px;gap:var(--s3);
  align-items:center;padding:6px 0}
.row .art{width:28px;height:28px;border-radius:0;background:var(--sunken);overflow:hidden;display:block}
.row .art img{width:100%;height:100%;object-fit:cover;display:block}
.list-h{padding:5px 0;font-size:11px;font-weight:400;color:var(--ink-3);background:transparent}
.list-h span:nth-child(n+3){text-align:right}
.row{border-top:1px solid var(--line-soft);font-size:13px;cursor:pointer;background:transparent}
.row:hover{background:var(--raised)}
.row[data-sel="1"]{background:var(--sunken)}
.row .n{font-size:11px;font-weight:400;color:var(--ink-3)}
.row .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.row .t small{color:var(--ink-3);margin-left:6px;font-size:11px;font-weight:400}
.row .t .why{display:block;font-size:11px;font-weight:400;line-height:1.35;margin-top:1px;color:var(--ink-3);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .d,.row .at{font-variant-numeric:tabular-nums;text-align:right;color:var(--ink-2)}
.row .at{color:var(--ink-3)}
/* removal rows: the clock after taking that track out turns black once it is
   inside the target, so the eye finds "from here down is enough" */
.row.fits .at{color:var(--ink);font-weight:400}
.row .d.minus{color:var(--caution-ink)}
.fresh{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap;margin-bottom:var(--s3)}
.fresh .dot{display:inline-block;width:7px;height:7px;border-radius:0;background:var(--ink);margin-right:6px}
.fresh .dot.rb{background:var(--caution)}
.views button{padding:5px 12px}
.bar .btn{padding:5px 10px;white-space:nowrap}
.bar .btn.glyph{font-size:15px;line-height:1;padding:3px 8px;min-width:30px}

/* ---- detail view: the analysis, one scrolling column ---- */
/* one scrolling column: the lanes keep their floor, the rest follows below */
.detail{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;overflow:auto}
.reality-row{padding:var(--s3) var(--s4);border-top:1px solid var(--line-soft);background:var(--page);flex:none}
.reality-row .reality{max-height:140px}

/* ---- write-back (rekordbox へ) ---- */
.pub-kv{display:grid;grid-template-columns:auto 1fr;gap:4px var(--s3);font-size:12px;margin:0 0 var(--s3)}
.pub-kv dt{color:var(--ink-3)} .pub-kv dd{margin:0;color:var(--ink)}
.pub-skip{font-size:12px;color:var(--caution-ink);margin:0 0 var(--s3);max-height:96px;overflow:auto}
.pub-state{display:flex;align-items:center;gap:var(--s2);font-size:12px;color:var(--ink-2);margin:0 0 var(--s3)}
.pub-state .dot{display:inline-block;width:7px;height:7px;background:var(--ink)}
.pub-state .dot.rb{background:var(--caution)}
.bk-list{display:flex;flex-direction:column;gap:2px;margin:var(--s2) 0 var(--s3)}
.bk-row{display:grid;grid-template-columns:1fr auto;gap:var(--s2);align-items:center;font-size:12px;
  padding:4px 0;border-bottom:1px solid var(--line-soft)}
.bk-row .meta{color:var(--ink-3)}
/* the last step of a set lives under its verdict, in the Carbon band */
.hero-block .hero-acts{display:flex;align-items:center;justify-content:flex-end;gap:var(--s3);margin-top:var(--s4)}
.hero-block .hero-acts .meta{font-size:12px;color:var(--on-carbon-2);margin-right:auto}
.hero-block .hero-acts .btn{color:var(--on-carbon);border-color:var(--on-carbon-2)}
.hero-block .hero-acts .btn:hover{background:var(--on-carbon);color:var(--carbon)}
.hero-block .hero-acts .btn.busy{border-color:var(--caution);color:var(--caution)}
/* ---- docked as a strip: below 300px the panel shows only the verdict ---- */
.mini{display:none}
@media (max-width:299px){
  .app,.drawer,.curtain{display:none!important}
  .mini{display:flex;flex-direction:column;gap:var(--s3);height:100vh;overflow:hidden;
    padding:var(--s3) var(--s3) var(--s4);background:var(--carbon);color:var(--on-carbon)}
  .mini .btn{align-self:flex-start;color:var(--on-carbon);border-color:var(--on-carbon-2);padding:2px 8px;min-width:0}
  .mini .btn:hover{background:var(--on-carbon);color:var(--carbon)}
  .mini .lbl{font-size:12px;color:var(--on-carbon-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mini .t{font-family:var(--display);font-size:30px;font-weight:300;line-height:1;letter-spacing:-.01em}
  .mini .d{align-self:flex-start;font-size:12px;font-weight:400;padding:1px 6px}
  .mini .d.over{background:var(--critical);color:#fff}
  .mini .d.under{background:var(--caution);color:#000}
  .mini .d.ok{border:1px solid var(--on-carbon-2);color:var(--on-carbon)}
  .mini dl{margin:var(--s2) 0 0;display:grid;grid-template-columns:auto 1fr;gap:4px var(--s2);font-size:12px}
  .mini dt{color:var(--on-carbon-2)} .mini dd{margin:0;text-align:right}
  .mini .imp{margin-top:auto;border-top:1px solid var(--carbon-2);padding-top:var(--s2);font-size:12px;color:var(--on-carbon-2)}
  .mini .imp b{display:block;font-family:var(--display);font-size:20px;font-weight:300;color:var(--on-carbon)}
}
/* ---- what rekordbox is showing, and the few numbers beside the length ---- */
.pl-head{display:flex;align-items:center;gap:var(--s2);min-width:0}
.pl-head .dot{flex:none;width:7px;height:7px;background:var(--ink)}
.pl-head .dot.off{background:transparent;border:1px solid var(--ink-3)}
.pl-head h1{margin:0;font-family:var(--display);font-size:19px;font-weight:300;line-height:1.2;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* no folder path under the name: rekordbox's tree already shows where it lives.
   the picker shown instead of the name when the selection can't be read. appearance:none
   drops WebKit's inner padding, so it needs its own or the text sits on the 1px frame */
.pl-head select{flex:1 1 auto;min-width:0;max-width:100%;height:30px;padding:4px 8px;
  background-color:var(--raised);color:var(--ink);border:1px solid var(--line);font-size:14px;
  text-overflow:ellipsis}
.insight{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s2);margin:0}
.insight div{border:1px solid var(--line-soft);background:var(--raised);padding:var(--s2) var(--s3)}
.insight dt{font-size:11px;color:var(--ink-3)} .insight dd{margin:2px 0 0;font-size:15px}
.insight dd.warn{color:var(--caution-ink)}
/* ---- improved version ---- */
.imp-head{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap}
.imp-head .seg button{padding:5px 12px}
.imp-help{font-size:12px;color:var(--ink-3);margin:var(--s2) 0 0}
.imp-res{border:1px solid var(--rule);background:var(--raised);padding:var(--s3) var(--s4);margin-top:var(--s3)}
.imp-res .top{display:flex;align-items:baseline;gap:var(--s3);flex-wrap:wrap}
.imp-res .t{font-family:var(--display);font-size:32px;font-weight:300;line-height:1}
.imp-res .cnts{display:flex;gap:var(--s3);font-size:12px;color:var(--ink-2);margin-top:var(--s2)}
.imp-res .cnts b{font-weight:400;color:var(--ink)}
.chg{list-style:none;margin:var(--s3) 0 0;padding:0;max-height:240px;overflow:auto;border-top:1px solid var(--line-soft)}
.chg li{display:grid;grid-template-columns:18px 1fr auto;gap:var(--s2);align-items:baseline;
  font-size:12px;padding:4px 0;border-bottom:1px solid var(--line-soft)}
.chg .k{font-weight:400;text-align:center}
.chg .k.add{color:var(--ink)} .chg .k.remove{color:var(--critical-ink)} .chg .k.move{color:var(--ink-3)}
.chg .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chg .x{color:var(--ink-3);white-space:nowrap}
.imp-res .acts{display:flex;flex-wrap:wrap;gap:var(--s2);margin-top:var(--s3);align-items:center}
.imp-res .acts .btn{white-space:nowrap}
.imp-res .acts .meta{margin-left:auto;font-size:12px;color:var(--ink-3)}
.dw-head select{max-width:130px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* screen mirroring: the QR stays black on white whatever the panel theme, so cameras read it */
.qr{display:flex;justify-content:center;margin:var(--s2) 0 var(--s3)}
.qr svg{width:216px;height:216px;background:#fff}
.qrUrl{word-break:break-all;user-select:all}
</style></head>
<body>

<div class="app" id="app" hidden>
  <div class="bar">
    <div class="seg views" role="group" aria-label="表示">
      <button type="button" data-view="main" aria-pressed="true"
        title="セット画面: 予測時間と、目標に合わせるための候補">set</button>
      <button type="button" data-view="detail" aria-pressed="false"
        title="詳細画面: 曲ごとの尺と展開（エネルギー）の対応、区間の予算">detail</button>
    </div>
    <span class="spacer"></span>
    <button class="btn glyph" id="collapseBtn" hidden aria-label="畳む" title="畳む">⇥</button>
    <button class="btn" id="agentBtn" title="チャット">agent</button>
    <button class="btn" id="settings" title="設定">settings</button>
  </div>

  <!-- ===== main view (Tier 1 only) ===== -->
  <!-- read top to bottom: what you asked for (conditions) -> what it adds up
       to (predicted length) -> what to do about the gap (card + candidates) -->
  <section class="main" id="main">
    <div>
      <div class="pl-head">
        <span class="dot" id="followDot" title="rekordbox で選んでいるプレイリスト"></span>
        <h1 id="plTitle">—</h1>
        <select id="pl" hidden aria-label="プレイリスト"></select>
      </div>
      <div class="cond-row">
        <label>target <input type="text" id="target" value="60:00" aria-label="目標時間"></label>
        <label>mix <select id="preset"></select></label>
        <label>curve <select id="curve"></select><span class="meta" id="curveEdited"></span></label>
        <label>bpm <input type="text" id="setBpm" placeholder="BPM"><span class="meta" id="setBpmAuto"></span></label>
        <label id="cap32Lbl"><input type="checkbox" id="cap32"> cap 32 bars</label>
        <label id="bpmVarLbl"><input type="checkbox" id="bpmVar"> bpm changes</label>
      </div>
      <div class="bpmv" id="bpmv" hidden>
        <div id="cpList"></div>
        <div class="addcp">
          <select id="cpTrack" title="この曲から BPM を変える"></select>
          <span class="meta" id="cpFrom" title="この変化点の直前まで効いている BPM"></span>
          <input type="text" id="cpBpm" placeholder="BPM" title="この曲からの BPM">
          <button class="btn" id="cpAdd" title="変化点を追加">add</button>
        </div>
      </div>
    </div>

    <div class="hero-block">
      <p class="eyebrow">predicted</p>
      <div class="hero" id="hero">—</div>
      <div class="gap-sub" id="heroSub"></div>
      <div class="bullet-track" title="予測時間（塗り）と目標（縦線）。目標を越えた分は赤">
        <div class="bullet-fill" id="bFill"></div>
        <div class="bullet-over" id="bOver"></div>
        <div class="bullet-tick" id="bTick"></div>
      </div>
      <div class="bullet-scale"><span>0:00</span><span id="bTargetLbl"></span><span id="bTotalLbl"></span></div>
    </div>

    <dl class="insight" id="insight"></dl>

    <div>
      <div class="imp-head">
        <p class="eyebrow" style="margin:0">improve</p>
        <div class="seg" role="group" aria-label="介入度" id="levelSeg"></div>
        <button class="btn primary" id="impMake" type="button">build</button>
      </div>
      <p class="imp-help" id="impHelp"></p>
      <div id="impRes"></div>
    </div>
  </section>

  <!-- ===== detail view (Tier 2: on demand) ===== -->
  <section class="detail" id="detail" hidden>
  <div class="transport">
    <div class="seg" role="group" aria-label="時間軸の密度" title="時間軸の密度。全体=1分36px / 詳細=1分96px（曲名が出ます）。どちらも横スクロール">
      <button type="button" data-zoom="section" aria-pressed="true">fit</button>
      <button type="button" data-zoom="detail" aria-pressed="false">zoom</button>
    </div>
    <span class="meta" id="density"></span>
    <div class="minimap" id="minimap" title="セット全体の縮図。クリックやドラッグで表示位置を移動"><div class="mm-view" id="mmView"></div></div>
  </div>

  <div class="scroll" id="scroll">
    <div class="canvas" id="canvas">
      <div class="lane-h" title="曲の並びと尺。幅＝再生時間。ダブルクリックでその曲のフレーズ構成を表示。ドラッグで並べ替え、端をドラッグで範囲を詰める試行">tracks</div>
      <div class="ruler" id="ruler"></div>
      <div class="tracks" id="tracks"></div>
      <div class="lane-h" title="実測の展開（フレーズ解析から）と、Curve で選んだ目標カーブ（点線）。点はドラッグ、ダブルクリックで追加、右クリックで削除">energy</div>
      <div class="energy" id="energy"></div>
      <div class="lane-h" title="マイルストーンで区切った区間ごとの曲数・尺・目標との過不足">sections</div>
      <div class="sections" id="sections"></div>
    </div>
  </div>

  <div class="legend">
    <span class="lg"><i class="sw hatch"></i>no phrase data</span>
    <span class="lg"><i class="sw" style="background:var(--target)"></i>target</span>
    <span class="lg"><i class="sw" style="border:1px dashed var(--target);background:var(--ghost-fill)"></i>improved</span>
    <span class="lg" id="analysisMeta" style="margin-left:auto;font-family:var(--mono)"></span>
  </div>

  <div class="reality-row"><div class="reality" id="reality"></div></div>

  <div class="foot">
    <div>
      <p class="eyebrow" title="選んだ曲の位置・再生尺・BPM・フレーズ">selected</p>
      <div id="selTitle" style="font-weight:600;font-size:13px">—</div>
      <dl class="kv" id="selKv"></dl>
    </div>
  </div>
  </section>
</div>

<div class="mini" id="mini" aria-label="Set Agent">
  <button class="btn" id="expandBtn" title="広げる" aria-label="広げる">⇤</button>
  <div class="lbl" id="miniL">—</div>
  <div class="t" id="miniT">—</div>
  <div class="d" id="miniD"></div>
  <dl id="miniKv"></dl>
  <div class="imp" id="miniImp" hidden></div>
</div>

<div class="curtain" id="curtain">
  <div class="box">
    <h1 id="cTitle">loading library…</h1>
    <p id="cMsg">rekordbox の master.db を復号して開いています。初回は少し時間がかかります。</p>
    <pre id="cDetail" hidden></pre>
    <button class="btn primary" id="cRetry" hidden>retry</button>
  </div>
</div>

<aside class="drawer" id="drawer" hidden aria-label="エージェント">
  <div class="dw-head">
    <h2>agent</h2>
    <label><select id="model" aria-label="モデル"></select></label>
    <button class="btn" id="dwClose">close</button>
  </div>
  <p class="dw-status" id="agentStatus" hidden></p>
  <div class="chat" id="chat"></div>
  <div class="dw-ask">
    <input type="text" id="askText" placeholder="ask the agent…">
    <button class="btn primary" id="askSend">send</button>
  </div>
  <p class="hint" id="askHints"></p>
  <div id="cands"></div>
  <div id="pending"></div>
</aside>

<div class="modal" id="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <h2 id="mTitle"></h2>
    <div id="mBody"></div>
    <div class="mActions" id="mActions"></div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>
<!-- artwork on hover: one image, no text (the native title carries the words) -->
<div class="artpop" id="artpop" hidden aria-hidden="true"><img alt=""></div>
<!-- right-click menu on a track: milestone / target time / position lock -->
<div class="ctx" id="ctx" hidden role="menu"></div>

<script>
const $ = id => document.getElementById(id);
/* px per minute. The 3px "overview" left on 2026-09-16: it squeezed 137 minutes
   into 400px and read as noise; the minimap already gives the whole-set view. */
/* "全体" fits the whole set to the lane width (no horizontal scroll; the panel
   lives beside rekordbox as a tall window, review 2026-09-17); "詳細" is 96px/min */
const DENSITY = {section:null, detail:96};
const PH_COLOR = {intro:"var(--ph-intro)", up:"var(--ph-up)", chorus:"var(--ph-chorus)",
                  down:"var(--ph-down)", outro:"var(--ph-outro)", verse:"var(--ph-verse)"};
let ST = null, BOOT = null, mode = "section", toastTimer = null;
let VIEW = "main", LOADED_AT = null;
let PRESET_LABEL = {}, PRESET_HELP = {};
const plabel = k => PRESET_LABEL[k] || k;
const popt = k => `<option value="${esc(k)}" title="${esc(PRESET_HELP[k] || "")}">${esc(plabel(k))}</option>`;
/* the drop cap only means something when the preset is built around drops */
const capApplies = () => ["one_drop", "two_drop"].includes($("preset").value);

const trk = n => `${n} ${n === 1 ? "track" : "tracks"}`;
const fmt = s => {
  const n = Math.round(Math.abs(s));
  return (s < 0 ? "-" : "") + Math.floor(n/60) + ":" + String(n%60).padStart(2,"0");
};
/* fit mode: the canvas is width:100% of the scroll box, so its own clientWidth
   (measured after layout, scrollbar included) is the truth -- not the box's */
function laneWidth(){ return Math.max($("canvas").clientWidth || $("scroll").clientWidth || 400, 200); }
const pps = () => mode === "section"
  ? laneWidth() / Math.max(ST ? ST.total_s : 1, 1)
  : DENSITY[mode] / 60;
/* narrowest block that still shows a label: 5px + 4px padding, one 11px glyph, "…" */
const LABEL_MIN_PX = 24;

function toast(msg){
  const t = $("toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>{t.hidden = true}, 4200);
}
function fail(title, msg, detail){
  $("curtain").hidden = false; $("app").hidden = true;
  $("cTitle").textContent = title; $("cMsg").textContent = msg;
  $("cDetail").hidden = !detail; $("cDetail").textContent = detail || "";
  $("cRetry").hidden = false;
}

/* ---------------- boot ---------------- */
async function boot(){
  const b = await window.pywebview.api.boot();
  if(b.error){
    fail("can't open the library", b.error + "\n\nrekordbox を一度起動してライブラリを作成してから、もう一度お試しください。",
         b.detail);
    return;
  }
  BOOT = b;
  setTheme(b.theme);
  PRESET_LABEL = b.preset_labels || {}; PRESET_HELP = b.preset_help || {};
  $("setBpm").value = b.set_bpm ? String(b.set_bpm) : "";
  fillPicker(b.playlist_items, b.playlist_id);
  FOLLOW = (b.follow || {}).why || "";
  LEVEL = b.level || "light";
  $("levelSeg").innerHTML = (b.levels || []).map(l =>
    `<button type="button" data-level="${esc(l.key)}">${esc(l.label)}</button>`).join("");
  LEVEL_HELP = Object.fromEntries((b.levels || []).map(l => [l.key, l.help]));
  $("model").innerHTML = (b.models || []).map(m => `<option value="${esc(m.id)}">${esc(m.label)}</option>`).join("");
  $("preset").innerHTML = b.presets.map(popt).join("");
  $("preset").value = b.preset;
  $("cap32").checked = !!b.cap32;
  $("cap32Lbl").hidden = !capApplies();
  $("curve").innerHTML = `<option value="">none</option>` +
    b.curves.map(c=>`<option value="${esc(c.key)}">${esc(c.label)}</option>`).join("");
  $("target").value = fmt(b.target_s);
  if(REMOTE){
    const s = await window.pywebview.api.state();
    if(s && s.tracks){ LOADED_AT = new Date(); apply(s, true); syncForm(s); }
    else await reload();
  } else await reload();
  startPolling();
}

/* The phone view (webui/remote.py) and the PC panel share one set. Every
   change bumps a revision on the PC; each view asks every 2s whether someone
   else moved it and, if so, repaints from state(). */
const REMOTE = !!window.SETAGENT_REMOTE, ME = window.SETAGENT_CLIENT || "pc";
let SYNC_REV = null, syncing = false;
async function pollSync(){
  if(syncing || !ST || !$("curtain").hidden) return;
  syncing = true;
  try {
    const r = await window.pywebview.api.sync_rev(SYNC_REV, ME);
    if(!r || r.error) return;
    const busy = drag || knobDrag || !$("modal").hidden;
    if(r.other && SYNC_REV !== null && !busy){
      const s = await window.pywebview.api.state();
      if(s && s.tracks){ apply(s); syncForm(s); }
    }
    if(!busy || !r.other) SYNC_REV = r.rev;
  } catch(e){ /* the other view going away is not news */ }
  finally { syncing = false; }
}
/* the condition fields are only written at boot; follow the other view's edits */
function syncForm(s){
  if(s.playlist_id && [...$("pl").options].some(o => o.value === s.playlist_id)) $("pl").value = s.playlist_id;
  if(s.preset) $("preset").value = s.preset;
  $("cap32").checked = !!s.cap32;
  $("cap32Lbl").hidden = !capApplies();
  if(s.target_s) $("target").value = fmt(s.target_s);
  $("curve").value = s.curve_key || "";
  $("setBpm").value = s.set_bpm_auto || !s.set_bpm ? "" : String(s.set_bpm);
}

function targetSeconds(){
  const m = /^(\d+):(\d{1,2})$/.exec($("target").value.trim());
  return m ? (+m[1])*60 + (+m[2]) : 3600;
}

function fillPicker(items, id){
  $("pl").innerHTML = (items || []).map(p =>
    `<option value="${esc(p.id)}">${esc(p.path)}</option>`).join("");
  if(id) $("pl").value = id;
}
/* id: load this playlist (following rekordbox); default: the picker's choice */
async function reload(id){
  if(typeof id !== "string") id = null;      /* never an Event from a listener */
  $("cTitle").textContent = "building the set…";
  $("cMsg").textContent = "フレーズ解析を読んで再生範囲を決めています。";
  $("curtain").hidden = false;
  const s = await window.pywebview.api.load({
    playlist_id: id || $("pl").value, preset: $("preset").value,
    cap32: $("cap32").checked, target_s: targetSeconds(),
  });
  LOADED_AT = new Date();
  apply(s, true);
}

function apply(s, firstPaint){
  if(!s){ return; }
  if(s.playlist_items) fillPicker(s.playlist_items, s.playlist_id);
  /* only boot/load failures take over the screen; an ordinary refusal is a toast */
  if(s.fatal){ fail("load failed", s.error, s.detail); return; }
  if(s.error && !s.tracks){ toast(s.error); return; }
  if(s.error) toast(s.error);
  if(s.notice) toast(s.notice);
  ST = s;
  $("curtain").hidden = true; $("app").hidden = false;
  render();
  if(firstPaint) $("scroll").scrollLeft = 0;
}

/* ---------------- render ---------------- */
const esc = t => String(t).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function render(){
  renderPublish(ST.publish);
  renderDock(ST.dock);
  renderHead();
  renderHero();
  renderInsight();
  renderImproved();
  renderFresh();
  renderReality();
  renderLanes();
  renderMinimap();
  renderMeta();
  renderSelected();
  renderAgent();
  syncView();
}

/* ---------------- view switch ---------------- */
function setView(v){
  VIEW = v;
  $("main").hidden = v !== "main";
  $("detail").hidden = v !== "detail";
  document.querySelectorAll("[data-view]").forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.view === v)));
  /* the lanes size themselves from the DOM, which is 0 while hidden */
  if(v === "detail" && ST){ renderLanes(); renderMinimap(); syncView(); }
}
document.querySelectorAll("[data-view]").forEach(b =>
  b.addEventListener("click", ()=> setView(b.dataset.view)));

/* ---------------- agent drawer ---------------- */
/* these are worded to hit the advisor's own vocabulary, so a DJ who clicks one
   always gets a real answer instead of "その言い方はまだ解釈できない" */
const HINTS = ["私の好みは？", "このプレイリストを整えて", "夜っぽいプレイリストはどれ？",
               "最近インポートした曲で合うものは？", "この曲の後に何をかけてきた？"];

function renderAgent(){
  const a = ST.agent || {};
  if(!a.ready) return;
  if(a.model && $("model").value !== a.model) $("model").value = a.model;
  /* only a problem is worth a line: the connection itself is not news */
  $("agentStatus").hidden = !!a.connected;
  $("agentStatus").textContent = a.connected ? "" : "Claude に接続していません（簡易モードで答えます）";

  const c = $("chat");
  const atBottom = c.scrollHeight - c.scrollTop - c.clientHeight < 40;
  c.innerHTML = (a.chat || []).map(m =>
    `<div class="msg ${esc(m.who)}">${esc(m.text)}</div>`).join("") ||
    "";
  if(atBottom) c.scrollTop = c.scrollHeight;

  $("askHints").innerHTML = HINTS.map(h =>
    `<a href="#" class="hintq" data-q="${esc(h)}">${esc(h)}</a>`).join(" · ");

  $("cands").innerHTML = !(a.candidates || []).length ? "" :
    `<p class="sec-title">candidates</p><div class="cand-list">` +
    a.candidates.map(x => `<button class="cand" data-id="${esc(x.track_id)}">
        <span title="${esc(x.title)}">${esc(x.title)}</span>
        <span>${(+x.bpm).toFixed(1)}</span><span>${esc(x.key || "")}</span>
        <span>${esc(x.in_slot || "")}</span></button>`).join("") + `</div>`;

  const p = a.pending;
  $("pending").innerHTML = !p ? "" :
    `<div class="card">
       <h3>${esc(p.title || "proposal")}</h3>
       ${p.reason ? `<p class="why">${esc(p.reason)}</p>` : ""}
       ${p.items.map(it => `<label><input type="checkbox" class="op" data-i="${it.i}"
           ${it.approved ? "checked" : ""}><span>${esc(it.text)}</span></label>`).join("")}
       <div class="diff">${p.diff.map(l => `<span>${esc(l)}</span>`).join("")}</div>
       <div class="acts">
         <button class="btn primary" id="applyPending">make improved</button>
         <button class="btn" id="rejectPending">reject</button>
       </div>
     </div>`;

  const mc = a.meta_card;
  if(mc && !REMOTE){
    $("pending").insertAdjacentHTML("beforeend",
      `<div class="card">
         <h3>${esc(mc.name)}</h3>
         ${mc.reason ? `<p class="why">${esc(mc.reason)}</p>` : ""}
         <ul class="chg">${mc.edits.map(e => `<li><span class="k add">✎</span><span class="n">${esc(e.title || e.track_id)}</span>
           <span class="x">${esc([e.comment != null ? "「" + e.comment + "」" : "", e.rating != null ? "★" + e.rating : "",
                                  e.color ? e.color : ""].filter(Boolean).join(" "))}</span></li>`).join("")}</ul>
         <div class="acts">
           <button class="btn primary" id="metaGo">write tags</button>
           <button class="btn" id="metaNo">cancel</button>
         </div>
       </div>`);
  }

  /* a proactive notice is worthless if the drawer is shut and nothing says so */
  const n = (a.chat || []).length;
  if($("drawer").hidden && n > seenMsgs) $("agentBtn").classList.add("hasnew");
  else { $("agentBtn").classList.remove("hasnew"); seenMsgs = n; }
}
let seenMsgs = 0;

/* ---------------- main view ---------------- */
/* The hero is the predicted length itself. A DJ glances here to learn "how long
   is this set", not "how far off am I" -- the gap is one pill underneath. */
const fitClass = d => d == null ? "" : d > ST.tolerance_s ? "over" : d < -ST.tolerance_s ? "under" : "ok";

function renderHero(){
  const d = ST.delta_s, tgt = ST.target_s || 0, tot = ST.total_s;
  const cls = fitClass(d);
  const h = $("hero");
  h.className = "hero " + cls;
  h.textContent = fmt(tot);
  const pill = cls === "over" ? `<span class="pill over">+${fmt(d)} over</span>`
             : cls === "under" ? `<span class="pill under">−${fmt(-d)} short</span>`
             : cls === "ok" ? `<span class="pill ok">on target</span>` : "";
  /* the target itself is read off the bar's scale below; here only the verdict,
     plus the tempo the prediction assumes, since that is what stretches it */
  const chain = [ST.set_bpm, ...(ST.bpm_changes || []).map(c => c.bpm)].filter(v => v != null);
  const bpm = chain.length
    ? `<span class="pill bpm" title="${ST.set_bpm_auto
          ? "プレイリストの BPM 中央値でかける前提の予測です。Target BPM に数字を入れると置き換わります"
          : "この BPM でかける前提の予測です"}">${chain.join(" → ")} bpm${ST.set_bpm_auto ? " · auto" : ""}</span>`
    : `<span class="pill bpm" title="BPM が分からないため、各曲を原曲の BPM でかける前提の予測です">original bpm</span>`;
  $("heroSub").innerHTML = pill + bpm + `<span class="cnt">${trk(ST.tracks.length)}</span>`;
  renderBpmVar();

  const span = Math.max(tot, tgt) || 1;
  $("bFill").style.width = (Math.min(tot,tgt)/span*100) + "%";
  const over = Math.max(0, tot - tgt);
  $("bOver").style.left = (tgt/span*100) + "%";
  $("bOver").style.width = (over/span*100) + "%";
  $("bTick").style.left = (tgt/span*100) + "%";
  $("curveEdited").textContent = ST.curve_edited ? " edited" : "";
  $("bTargetLbl").textContent = "target " + fmt(tgt);
  $("bTotalLbl").textContent = fmt(tot);
  renderMini();
}

/* the collapsed strip (dock): the playlist rekordbox shows, its length, the verdict */function renderMini(){
  if(!ST) return;
  const d = ST.delta_s, cls = fitClass(d);
  $("miniT").textContent = fmt(ST.total_s);
  const m = $("miniD");
  m.className = "d " + cls;
  m.textContent = cls === "over" ? `+${fmt(d)}` : cls === "under" ? `−${fmt(-d)}` : cls === "ok" ? "on target" : "";
  $("miniL").textContent = ST.playlist || "—";
  const i = ST.insight || {};
  $("miniKv").innerHTML = [["target", fmt(ST.target_s || 0)], ["tracks", ST.tracks.length],
    ["bpm", ST.set_bpm || "—"], ["peak", i.peak || "—"], ["clashes", i.rough != null ? i.rough : "—"]]
    .map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join("");
  const im = ST.improved;
  $("miniImp").hidden = !im;
  if(im) $("miniImp").innerHTML = `${esc(im.label)}<b>${esc(im.after.total)}</b>`;
}

/* ---- the playlist rekordbox is showing ---- */
let FOLLOW = "", LEVEL = "light", LEVEL_HELP = {};
/* why -> what the dot says. "reading" = the status line can be read at all
   (the picker stays hidden); "on" = what is shown is what rekordbox shows. */
const FOLLOW_SAY = {
  ok:            [true,  true,  "rekordbox の選択に追従中"],
  no_match:      [true,  false, "rekordbox で表示中のリストはプレイリストではありません（コレクション・検索・インテリジェントプレイリストなど）。最後のプレイリストを表示しています"],
  busy:          [true,  false, "rekordbox が応答しません（解析中など）。最後のプレイリストを表示しています"],
  no_permission: [false, false, "選んでいるプレイリストを読むには許可が必要です（settings → allow）"],
  not_running:   [false, false, "rekordbox が起動していません"],
};
function renderHead(){
  $("plTitle").textContent = ST.playlist || "—";
  const [reading, on, say] = FOLLOW_SAY[FOLLOW] || [false, false, "rekordbox の選択を読めません"];
  $("followDot").className = "dot" + (on ? "" : " off");
  $("followDot").title = say;
  $("plTitle").title = say;
  /* without the live selection, the DJ picks the playlist here */
  $("pl").hidden = reading || REMOTE ? true : false;
  $("plTitle").hidden = !$("pl").hidden;
  $("settings").classList.toggle("hasnew", FOLLOW === "no_permission" || FRESH.state === "stale");
}

/* ---- the few numbers beside the length ---- */
function renderInsight(){
  const i = ST.insight || {};
  const cells = [
    ["peak", i.peak || "—", ""],
    ["clashes", i.rough != null ? `${i.rough}` : "—", i.rough ? "warn" : ""],
    ["phrase data", i.tracks ? `${i.phrases}/${i.tracks}` : "—", ""],
  ];
  $("insight").innerHTML = cells.map(([k, v, c]) => `<div><dt>${k}</dt><dd class="${c}">${esc(v)}</dd></div>`).join("");
}

/* ---- improved version: a new playlist next to the DJ's, never an edit of it ---- */
const KIND = {add: "+", remove: "−", move: "↕"};
function renderImproved(){
  document.querySelectorAll("[data-level]").forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.level === LEVEL)));
  $("impHelp").textContent = LEVEL_HELP[LEVEL] || "";
  const m = ST.improved, box = $("impRes");
  if(!m){ box.innerHTML = ""; renderMini(); return; }
  const a = m.after, b = m.before, c = m.counts;
  const cls = fitClass(a.delta_s);
  const pill = cls === "over" ? `<span class="pill over">+${fmt(a.delta_s)} over</span>`
             : cls === "under" ? `<span class="pill under">−${fmt(-a.delta_s)} short</span>`
             : cls === "ok" ? `<span class="pill ok">on target</span>` : "";
  const busy = PUB && PUB.active;
  box.innerHTML = `<div class="imp-res">
      <div class="top"><span class="t">${esc(a.total)}</span>${pill}
        <span class="meta">${esc(m.label)} · ${trk(a.tracks)}</span></div>
      <div class="cnts"><span>add <b>${c.add}</b></span><span>remove <b>${c.remove}</b></span>
        <span>move <b>${c.move}</b></span><span>clashes <b>${b.rough} → ${a.rough}</b></span></div>
      ${m.changes.length ? `<ul class="chg">${m.changes.map(x =>
          `<li><span class="k ${x.kind}">${KIND[x.kind]}</span><span class="n" title="${esc(x.title)}">${esc(x.title)}</span>
           <span class="x">${esc(x.detail || "")}</span></li>`).join("")}</ul>` : `<p class="imp-help">${esc(m.note || "no changes")}</p>`}
      <div class="acts">
        <button class="btn primary" id="impWrite" ${m.changes.length && !REMOTE ? "" : "disabled"}>${busy ? "exporting…" : "export to rekordbox"}</button>
        <button class="btn" id="impDrop">discard</button>
        <span class="meta" id="pubState"></span>
      </div></div>`;
  renderPublish(PUB);
  renderMini();
}
document.addEventListener("click", async e=>{
  const lv = e.target.closest("[data-level]");
  if(lv){ LEVEL = lv.dataset.level; renderImproved(); window.pywebview.api.set_prefs(null, LEVEL); return; }
  if(e.target.id === "impMake"){ e.target.disabled = true;
    try { apply(await window.pywebview.api.make_improved(LEVEL)); } finally { e.target.disabled = false; } }
  if(e.target.id === "impDrop") apply(await window.pywebview.api.discard_improved());
  if(e.target.id === "impWrite") openPublish(null);
});

/* Artwork: rekordbox's own JPEG per track, downscaled by the bridge into data
   URLs and cached here for the session. Rows render at once and fill in. */
const ART = {};
let artBusy = false;
async function loadArtwork(){
  if(artBusy || !ST) return;
  const ids = ST.tracks.map(t => t.track_id).concat(((ST.reco || {}).items || []).map(it => it.track_id));
  const want = [...new Set(ids)].filter(id => id && !(id in ART));
  if(!want.length) return;
  artBusy = true;
  try {
    for(let i = 0; i < want.length; i += 24){
      const got = await window.pywebview.api.artwork(want.slice(i, i + 24), 56);
      for(const [id, url] of Object.entries(got || {})){
        ART[id] = url;
        if(url) document.querySelectorAll(`.row .art[data-art="${id}"]`).forEach(el => {
          el.innerHTML = `<img src="${url}" alt="">`;
        });
      }
    }
  } catch(e){ /* thumbnails are decoration; the list works without them */ }
  finally { artBusy = false; }
}

/* ---- artwork popover ----
   Hovering a track block (.trk) or a candidate row (.row) for a moment opens a
   120px window with that track's artwork, beside the pointer. Bigger thumbnails
   are fetched once per track and kept for the session (ART_L). Nothing opens
   when the track has no artwork. Focus (keyboard) anchors it to the element. */
const ART_L = {}, ART_L_PX = 120, ART_POP_DELAY_MS = 260;
let artPop = {timer: null, id: null};
function artIdOf(node){
  if(!ST) return null;
  if(node.classList.contains("trk")){
    const t = ST.tracks.find(x => x.i === +node.dataset.i);
    return t ? t.track_id : null;
  }
  const a = node.querySelector(".art"); return a ? a.dataset.art : null;
}
function placeArtPop(x, y){
  const p = $("artpop"), m = 14, W = ART_L_PX + 10, H = ART_L_PX + 10;
  let left = x + m, top = y + m;
  if(left + W > innerWidth - 4) left = x - m - W;
  if(top + H > innerHeight - 4) top = y - m - H;
  p.style.left = Math.max(4, left) + "px"; p.style.top = Math.max(4, top) + "px";
}
function hideArtPop(){
  clearTimeout(artPop.timer); artPop.timer = null; artPop.id = null;
  const p = $("artpop"); p.hidden = true; p.setAttribute("aria-hidden", "true");
}
async function showArtPop(id, x, y){
  if(!(id in ART_L)){
    try {
      const got = await window.pywebview.api.artwork([id], ART_L_PX);
      ART_L[id] = (got || {})[id] || "";
    } catch(e){ ART_L[id] = ""; }
  }
  if(artPop.id !== id || !ART_L[id]) return;      /* pointer moved on, or no artwork */
  const p = $("artpop"); p.querySelector("img").src = ART_L[id];
  placeArtPop(x, y); p.hidden = false; p.setAttribute("aria-hidden", "false");
}
function armArtPop(node, x, y){
  const id = artIdOf(node);
  if(!id){ hideArtPop(); return; }
  if(id === artPop.id){ if(!$("artpop").hidden) placeArtPop(x, y); return; }
  hideArtPop(); artPop.id = id;
  artPop.timer = setTimeout(()=> showArtPop(id, x, y), ART_POP_DELAY_MS);
}
for(const host of [$("tracks")]){
  host.addEventListener("pointermove", e=>{
    if(drag){ hideArtPop(); return; }               /* never over a drag */
    const n = e.target.closest(".trk, .row");
    if(!n){ hideArtPop(); return; }
    armArtPop(n, e.clientX, e.clientY);
  });
  host.addEventListener("pointerleave", hideArtPop);
  host.addEventListener("pointerdown", hideArtPop);
  host.addEventListener("focusin", e=>{
    const n = e.target.closest(".trk, .row"); if(!n) return;
    const r = n.getBoundingClientRect(); armArtPop(n, r.left + Math.min(r.width, 40), r.bottom);
  });
  host.addEventListener("focusout", hideArtPop);
}
addEventListener("scroll", hideArtPop, true);

/* ---- context menu: milestone / target time / position lock ----
   Milestones are the DJ's anchors; the agent fills the room between them
   (analysis.plan_fill_sections). Locks pin a track's position. Both go through
   the existing bridge calls, so they land in History and can be undone. */
let ctxIndex = null;
function parseMmss(v){
  const m = /^\s*(\d{1,3}):(\d{2})\s*$/.exec(v || "");
  if(m) return +m[1]*60 + +m[2];
  const n = parseFloat(v); return isNaN(n) ? null : Math.round(n*60);
}
function openCtx(x, y, i){
  const t = ST && ST.tracks.find(o => o.i === i); if(!t) return;
  ctxIndex = i; hideArtPop();
  const isMile = !!t.milestone, locked = (t.locks || []).includes("position");
  const c = $("ctx");
  c.innerHTML = `<div class="h">${i + 1}. ${esc(t.title)}</div>
    <button data-act="mile" class="${isMile ? "on" : ""}" title="改善版でもこの曲を要として残します">${isMile ? "unset milestone" : "milestone"}</button>
    <button data-act="time" >target time…${t.milestone_s != null ? ` (${fmt(t.milestone_s)})` : ""}</button>
    <button data-act="lock" class="${locked ? "on" : ""}" title="改善版でもこの位置から動かしません">${locked ? "unlock" : "lock"}</button>`;
  c.hidden = false;
  const W = 220, H = c.offsetHeight || 120;
  c.style.left = Math.max(4, Math.min(x, innerWidth - W - 4)) + "px";
  c.style.top = Math.max(4, Math.min(y, innerHeight - H - 4)) + "px";
  c.querySelector("button").focus();
}
function hideCtx(){ $("ctx").hidden = true; ctxIndex = null; }
for(const host of [$("tracks")]){
  host.addEventListener("contextmenu", e=>{
    const n = e.target.closest(".trk, .row.rm"); if(!n || n.dataset.i == null) return;
    e.preventDefault(); openCtx(e.clientX, e.clientY, +n.dataset.i);
  });
}
$("tracks").addEventListener("keydown", e=>{
  const n = e.target.closest(".trk"); if(!n) return;
  if(e.key === "m" || e.key === "M"){ e.preventDefault(); const r = n.getBoundingClientRect(); openCtx(r.left, r.bottom, +n.dataset.i); }
});
$("ctx").addEventListener("click", async e=>{
  const b = e.target.closest("button[data-act]"); if(!b || ctxIndex == null) return;
  const i = ctxIndex, t = ST.tracks.find(o => o.i === i);
  const act = b.dataset.act; hideCtx();
  if(act === "mile"){
    apply(await window.pywebview.api.set_milestone(i, t.milestone ? null : -1));
    toast(t.milestone ? "milestone unset" : "milestone set");
    return;
  }
  if(act === "lock"){
    apply(await window.pywebview.api.set_lock(i, "position", !(t.locks || []).includes("position")));
    return;
  }
  modal("target time",
    `<p>${esc(t.title)} を鳴らしたい時刻を mm:ss で入力してください。</p>
     <div class="field"><span>target time</span><input type="text" id="fTime" value="${t.milestone_s != null ? fmt(t.milestone_s) : fmt(t.start_s)}"></div>
     <p class="hint">この曲はマイルストーンになり、前の区間の予算がこの時刻までになります。</p>`,
    [{label:"cancel"},
     {label:"set", primary:true, close:false, run: async ()=>{
        const secs = parseMmss($("fTime").value);
        if(secs == null){ toast("mm:ss で入力してください"); return; }
        closeModal();
        apply(await window.pywebview.api.set_milestone(i, secs));
     }}]);
  setTimeout(()=>{ const f = $("fTime"); if(f){ f.focus(); f.select(); } }, 30);
});
addEventListener("pointerdown", e=>{ if(!e.target.closest("#ctx")) hideCtx(); }, true);
addEventListener("keydown", e=>{ if(e.key === "Escape") hideCtx(); });
